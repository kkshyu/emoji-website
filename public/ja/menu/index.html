<style>
  /* ja 版：日本語グリフのため JP フォントを優先 */
  :root{
    --serif:"Noto Serif JP","Noto Serif TC",serif;
    --latin:"Cormorant Garamond","Noto Serif JP",serif;
    --sans:"Noto Sans JP","Noto Sans TC",system-ui,-apple-system,sans-serif;
  }

  .menu-hero{padding:56px 0 40px;border-bottom:1px solid var(--line)}
  .menu-hero__kicker{font-size:.76rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .menu-hero__title{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.28;margin:18px 0 0}
  .menu-hero__title .hl{background:linear-gradient(transparent 58%,var(--accent) 58%,var(--accent) 94%,transparent 94%);padding:0 .04em}
  .menu-hero__lede{margin-top:18px;max-width:56ch;color:var(--ink-soft);font-weight:300;font-size:1.02rem;line-height:1.9}

  .menu-body{padding:48px 0 80px}
  .menu-empty{padding:80px 24px;text-align:center;color:var(--muted);font-family:var(--serif);font-size:1.3rem}

  .menu-group{margin-bottom:52px}
  .menu-group__head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;padding-bottom:10px;border-bottom:1.5px solid var(--ink)}
  .menu-group__zh{font-family:var(--serif);font-weight:500;font-size:1.5rem;letter-spacing:.04em}
  .menu-group__en{font-family:var(--latin);font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  .menu-list{list-style:none}
  .menu-item{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
  .menu-item:last-child{border-bottom:none}
  .menu-item__names{min-width:0}
  .menu-item__zh{font-family:var(--serif);font-weight:500;font-size:1.08rem}
  .menu-item__en{margin-left:.7em;font-family:var(--latin);font-size:.86rem;letter-spacing:.03em;color:var(--muted)}
  .menu-item__note{margin-top:5px;font-size:.86rem;color:var(--muted);font-weight:300}
  .menu-item__price{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .menu-item__price .now{font-family:var(--latin);font-size:1.12rem;font-weight:600;color:var(--ink)}
  .menu-item__price .orig{display:block;margin-top:2px;font-size:.78rem;color:var(--muted)}
  .menu-item__price .orig s{text-decoration-color:var(--muted)}

  .menu-notice{margin-top:8px;padding:16px 20px;background:var(--paper-alt);border:1px solid var(--line);border-radius:var(--radius-sm);font-size:.86rem;color:var(--ink-soft);font-weight:400}

  @media(max-width:640px){
    .menu-item__en{display:block;margin-left:0;margin-top:2px}
  }

<a href="#content" class="skip-link">本文へスキップ</a>

<!--SITE_HEADER-->

<main id="content">
  <div class="wrap">
    <header class="menu-hero">
      <p class="menu-hero__kicker">Menu · 言文字メニュー</p>
      <h1 class="menu-hero__title">昼はカフェ、<br>夜は<span class="hl">バー</span>に。</h1>
      <p class="menu-hero__lede">会員価格（Emo価格）は創始会員および年会員限定です。メニューは季節や在庫状況により変更される場合があります。正式な品目と価格は、店頭の表示をご確認ください。</p>
    </header>
  </div>

  <div class="wrap menu-body">
    <div id="menuRoot">
      <p class="menu-empty">メニュー準備中</p>
    </div>
  </div>
</main>

<!--SITE_FOOTER-->

<script src="/menu-lib.js"></script>
<script>
(function () {
  var CAT_LABEL = {
    COFFEE: { zh: 'コーヒー', en: 'Coffee' },
    BEVERAGE: { zh: 'ドリンク', en: 'Beverage' },
    ALCOHOL: { zh: 'アルコール', en: 'Alcohol' },
    FOOD: { zh: 'フード', en: 'Food' },
    SNACK: { zh: 'スナック', en: 'Snack' },
  };
  var esc = function (s) {
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var money = function (n) { return 'NT$' + Number(n || 0).toLocaleString('ja-JP'); };

  var root = document.getElementById('menuRoot');

  function renderEmpty() {
    root.innerHTML = '<p class="menu-empty">メニュー準備中</p>';
  }

  function renderItem(item) {
    var showOrig = item.emo > 0 && item.emo !== item.price;
    var priceHtml = showOrig
      ? '<span class="now">' + money(item.emo) + '</span><span class="orig">定価 <s>' + money(item.price) + '</s></span>'
      : '<span class="now">' + money(item.price) + '</span>';
    return (
      '<li class="menu-item">' +
        '<div class="menu-item__names">' +
          '<span class="menu-item__zh">' + esc(item.zh) + '</span>' +
          (item.en ? '<span class="menu-item__en">' + esc(item.en) + '</span>' : '') +
          (item.note ? '<div class="menu-item__note">' + esc(item.note) + '</div>' : '') +
        '</div>' +
        '<div class="menu-item__price">' + priceHtml + '</div>' +
      '</li>'
    );
  }

  function render(items) {
    if (!items.length) { renderEmpty(); return; }
    var hasAlcohol = items.some(function (it) { return it.alcohol; });
    var byCat = {};
    var order = [];
    items.forEach(function (it) {
      if (!byCat[it.cat]) { byCat[it.cat] = []; order.push(it.cat); }
      byCat[it.cat].push(it);
    });
    var html = order.map(function (cat) {
      var label = CAT_LABEL[cat] || { zh: cat, en: '' };
      return (
        '<section class="menu-group">' +
          '<div class="menu-group__head">' +
            '<h2 class="menu-group__zh">' + esc(label.zh) + '</h2>' +
            '<span class="menu-group__en">' + esc(label.en) + '</span>' +
          '</div>' +
          '<ul class="menu-list">' + byCat[cat].map(renderItem).join('') + '</ul>' +
        '</section>'
      );
    }).join('');
    if (hasAlcohol) {
      html += '<p class="menu-notice">18歳未満の飲酒はできません。飲酒運転は絶対にしないでください。</p>';
    }
    root.innerHTML = html;
  }

  fetch('/api/public')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var raw = d && d.content && d.content.menu;
      var doc = window.MenuLib.parseMenuDoc(raw);
      var items = window.MenuLib.sortItems(window.MenuLib.publishedOnly(doc));
      render(items);
    })
    .catch(renderEmpty);
})();
</script>
</body>
