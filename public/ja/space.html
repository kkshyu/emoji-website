<style>
  .space-hero { padding: 80px 0 48px; text-align: center; border-bottom: 1px solid var(--line); }
  .space-hero h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.2; margin-bottom: 20px; }
  .space-hero .eyebrow { margin-bottom: 16px; }
  .space-hero .lede { max-width: 36rem; margin: 0 auto; color: var(--ink-soft); font-size: 1.08rem; line-height: 1.8; }
  .hero-media { max-width: 960px; margin: 40px auto 0; }
  .hero-media img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px; background: var(--paper); box-sizing: border-box; }
  .hero-media[hidden] { display: none; }
  .floor-media img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px; background: var(--paper); box-sizing: border-box; }
  .md-content { line-height: 1.8; color: var(--ink-soft); font-size: 1.08rem; }
  .md-content h2, .md-content h3 { color: var(--ink); margin-top: 1.5em; margin-bottom: 0.5em; }
  .md-content p { margin-bottom: 1em; }
  .md-content ul, .md-content ol { margin-bottom: 1em; padding-left: 20px; }
  .md-content li { margin-bottom: 0.5em; }
  .menu-empty { padding: 24px 0; text-align: center; color: var(--muted); font-family: var(--serif); font-size: 1.2rem; }
  .menu-group { margin-bottom: 52px; }
  .menu-group__head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink); }
  .menu-group__zh { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; letter-spacing: .04em; }
  .menu-group__en { font-family: var(--latin); font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .menu-list { list-style: none; padding: 0; }
  .menu-item { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .menu-item:last-child { border-bottom: none; }
  .menu-item__names { min-width: 0; }
  .menu-item__zh { font-family: var(--serif); font-weight: 500; font-size: 1.08rem; }
  .menu-item__en { margin-left: .7em; font-family: var(--latin); font-size: .86rem; letter-spacing: .03em; color: var(--muted); }
  .menu-item__note { margin-top: 5px; font-size: .86rem; color: var(--muted); font-weight: 300; }
  .menu-item__price { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .menu-item__price .now { font-family: var(--latin); font-size: 1.12rem; font-weight: 600; color: var(--ink); }
  .menu-item__price .orig { display: block; margin-top: 2px; font-size: .78rem; color: var(--muted); }
  .menu-notice { margin-top: 8px; padding: 16px 20px; background: var(--paper-alt); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: .86rem; color: var(--ink-soft); }

<!--SITE_HEADER-->

<main id="content">

  <section class="space-hero">
    <div class="wrap">
      <span class="eyebrow reveal">Taiwan Talent Hub</span>
      <h1 class="reveal">四層の<em class="swash">リアルな拠点</em></h1>
      <p class="lede reveal">台湾で最も人材密度の高いハブ。普段は出会えない人と、台北駅のそばで出会う。</p>
      <figure class="hero-media" id="media-hero" hidden>
        <img src="" alt="言文字｜台湾タレントハブ 外観">
      </figure>
    </div>
  </section>

  <section class="space-dir" id="directory" aria-label="フロア図">
    <div id="space-dir-root"></div>
  </section>

  <section class="space-panel wrap" id="floor-detail" hidden>
    <div class="space-panel__inner">
      <div class="space-panel__head">
        <span class="space-panel__no" data-panel-no>1F</span>
        <h2 class="space-panel__title" data-panel-title>Emoji · Café &amp; Bar</h2>
        <button type="button" class="space-panel__close" data-space-close>閉じる</button>
      </div>
      <figure class="floor-media" data-panel-media hidden>
        <img src="" alt="">
      </figure>
      <div class="md-content" data-panel-md></div>
      <div class="space-panel__menu" data-panel-menu hidden>
        <h3 class="space-panel__menu-title" data-panel-menu-title>メニュー Menu</h3>
        <div data-panel-menu-body></div>
      </div>
    </div>
  </section>

</main>

<!--SITE_FOOTER-->

<script>
(function() {
  var htmlLang = (document.documentElement.getAttribute('lang') || 'zh').toLowerCase();
  var LANG = htmlLang.indexOf('en') === 0 ? 'en' : (htmlLang.indexOf('ja') === 0 ? 'ja' : 'zh');
  var FAIL_TEXT = { zh: '無法載入資料。', en: 'Could not load content.', ja: '読み込めませんでした。' }[LANG];
  var EMPTY_MENU = { zh: '目前尚未提供菜單資料。', en: 'Menu coming soon.', ja: 'メニュー準備中。' }[LANG];
  var ORIG_LABEL = { zh: '原價', en: 'Was', ja: '定価' }[LANG];

  var CAT_LABEL = {
    COFFEE: { zh: '咖啡', en: 'Coffee', ja: 'コーヒー' },
    BEVERAGE: { zh: '飲品', en: 'Beverage', ja: 'ドリンク' },
    ALCOHOL: { zh: '酒精飲品', en: 'Alcohol', ja: 'アルコール' },
    FOOD: { zh: '餐點', en: 'Food', ja: 'フード' },
    SNACK: { zh: '點心', en: 'Snack', ja: 'おやつ' },
  };
  var esc = function (s) {
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var money = function (n) { return 'NT$' + Number(n || 0).toLocaleString('zh-TW'); };

  function menuHtml(items) {
    if (!items || !items.length) return '<p class="menu-empty">' + EMPTY_MENU + '</p>';
    var hasAlcohol = items.some(function (it) { return it.alcohol; });
    var byCat = {};
    var order = [];
    items.forEach(function (it) {
      if (!byCat[it.cat]) { byCat[it.cat] = []; order.push(it.cat); }
      byCat[it.cat].push(it);
    });
    var html = order.map(function (cat) {
      var label = CAT_LABEL[cat] || { zh: cat, en: '', ja: cat };
      var title = LANG === 'en' ? label.en : (LANG === 'ja' ? label.ja : label.zh);
      var sub = LANG === 'zh' ? label.en : '';
      return (
        '<section class="menu-group">' +
          '<div class="menu-group__head">' +
            '<h3 class="menu-group__zh">' + esc(title) + '</h3>' +
            (sub ? '<span class="menu-group__en">' + esc(sub) + '</span>' : '') +
          '</div>' +
          '<ul class="menu-list">' + byCat[cat].map(function (item) {
            var showOrig = item.emo > 0 && item.emo !== item.price;
            var priceHtml = showOrig
              ? '<span class="now">' + money(item.emo) + '</span><span class="orig">' + ORIG_LABEL + ' <s>' + money(item.price) + '</s></span>'
              : '<span class="now">' + money(item.price) + '</span>';
            return (
              '<li class="menu-item">' +
                '<div class="menu-item__names">' +
                  '<span class="menu-item__zh">' + esc(item.zh) + '</span>' +
                  (item.en ? '<span class="menu-item__en">' + esc(item.en) + '</span>' : '') +
                  (item.note ? '<div class="menu-item__note">' + esc(item.note) + '</div>' : '') +
                '</div>' +
                '<div class="menu-item__price">' + priceHtml + '</div>' +
              '</li>'
            );
          }).join('') + '</ul>' +
        '</section>'
      );
    }).join('');
    if (hasAlcohol) {
      html += '<p class="menu-notice">未滿十八歲禁止飲酒。禁止酒駕。 / No alcohol under 18. Don\'t drink and drive.</p>';
    }
    return html;
  }

  var dir = new SpaceDir({
    lang: LANG,
    root: document.getElementById('space-dir-root'),
    panel: document.getElementById('floor-detail'),
  });

  fetch('/api/public')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var content = (d && d.content) || {};
      var hero = document.getElementById('media-hero');
      var heroUrl = String(content.space_hero_image || '').trim();
      if (hero && heroUrl) {
        hero.querySelector('img').src = heroUrl;
        hero.hidden = false;
      }
      var items = [];
      if (content.menu && window.MenuLib) {
        var doc = window.MenuLib.parseMenuDoc(content.menu);
        items = window.MenuLib.sortItems(window.MenuLib.publishedOnly(doc));
      }
      dir.setData(content, menuHtml(items));
      dir.openFromHash();
    })
    .catch(function (err) {
      console.error(err);
      dir.setData({}, '<p class="menu-empty">' + FAIL_TEXT + '</p>');
    });

  window.addEventListener('hashchange', function () { dir.openFromHash(); });
})();
</script>
</body>
