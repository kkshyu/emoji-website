<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>document.documentElement.className='js'</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1A17">
<title>空間介紹 · 言文字｜台灣人才聚落</title>
<meta name="description" content="言文字｜台灣人才聚落空間介紹：一樓 Café & Bar、二樓會員專屬休憩空間、三樓共享辦公與活動場地。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/nav.css">
<script defer src="/nav.js"></script>
<!-- Markdown Parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Menu Rendering Library -->
<script src="/menu-lib.js"></script>
<style>
  .space-hero { padding: 80px 0 60px; text-align: center; border-bottom: 1px solid var(--line); }
  .space-hero h1 { font-size: clamp(2rem, 5vw, 3rem); line-height: 1.2; margin-bottom: 20px; }
  .space-hero .eyebrow { margin-bottom: 16px; }
  
  .floor-section { padding: 80px 0; border-bottom: 1px solid var(--line); }
  .floor-section:nth-child(even) { background-color: var(--paper-alt); }
  .floor-header { margin-bottom: 40px; }
  .floor-num { font-family: var(--latin); font-size: 4rem; color: var(--accent); line-height: 1; font-weight: 600; text-shadow: 2px 2px 0 var(--ink); margin-bottom: 10px; }
  .floor-title { font-size: 2rem; margin-bottom: 10px; }
  
  .md-content { max-width: 800px; line-height: 1.8; color: var(--ink-soft); font-size: 1.1rem; }
  .md-content h2, .md-content h3 { color: var(--ink); margin-top: 1.5em; margin-bottom: 0.5em; }
  .md-content p { margin-bottom: 1em; }
  .md-content ul, .md-content ol { margin-bottom: 1em; padding-left: 20px; }
  .md-content li { margin-bottom: 0.5em; }

  /* 菜單共用樣式 (來自 menu/index.html) */
  .menu-body { padding: 80px 0; background: var(--paper); border-bottom: 1px solid var(--line); }
  .menu-empty { padding: 40px 24px; text-align: center; color: var(--muted); font-family: var(--serif); font-size: 1.3rem; }
  .menu-group { margin-bottom: 52px; max-width: 800px; }
  .menu-group__head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink); }
  .menu-group__zh { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; letter-spacing: .04em; }
  .menu-group__en { font-family: var(--latin); font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .menu-list { list-style: none; padding: 0; }
  .menu-item { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .menu-item:last-child { border-bottom: none; }
  .menu-item__names { min-width: 0; }
  .menu-item__zh { font-family: var(--serif); font-weight: 500; font-size: 1.08rem; }
  .menu-item__en { margin-left: .7em; font-family: var(--latin); font-size: .86rem; letter-spacing: .03em; color: var(--muted); }
  .menu-item__note { margin-top: 5px; font-size: .86rem; color: var(--muted); font-weight: 300; }
  .menu-item__price { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .menu-item__price .now { font-family: var(--latin); font-size: 1.12rem; font-weight: 600; color: var(--ink); }
  .menu-item__price .orig { display: block; margin-top: 2px; font-size: .78rem; color: var(--muted); }
  .menu-item__price .orig s { text-decoration-color: var(--muted); }
  .menu-notice { margin-top: 8px; padding: 16px 20px; background: var(--paper-alt); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: .86rem; color: var(--ink-soft); font-weight: 400; max-width: 800px; }
  
  @media(max-width: 640px) {
    .menu-item__en { display: block; margin-left: 0; margin-top: 2px; }
  }
</style>
</head>
<body>
<a href="#content" class="skip-link">跳至主要內容</a>

<!--SITE_HEADER-->

<main id="content">

  <section class="space-hero">
    <div class="wrap">
      <span class="eyebrow reveal">Taiwan Talent Hub</span>
      <h1 class="reveal">三層樓的<em class="swash">實體聚落</em></h1>
      <p class="md-content" style="margin:0 auto">打造台灣人才密度最高的聚落，讓平常不會遇到的人，在台北車站旁相遇。</p>
    </div>
  </section>

  <!-- 1F -->
  <section class="floor-section" id="f1">
    <div class="wrap">
      <div class="floor-header">
        <div class="floor-num">1F</div>
        <h2 class="floor-title serif">Emoji Café & Bar</h2>
      </div>
      <div class="md-content" id="render-1f">
        <!-- Markdown injected here -->
        <p class="menu-empty">讀取中...</p>
      </div>
    </div>
  </section>

  <!-- Menu injected inside 1F area logically, but in its own section -->
  <section class="menu-body" id="menu-section">
    <div class="wrap">
      <h2 class="serif" style="margin-bottom: 30px; font-size: 2rem;">餐飲菜單 Menu</h2>
      <div id="render-menu">
        <p class="menu-empty">讀取中...</p>
      </div>
    </div>
  </section>

  <!-- 2F -->
  <section class="floor-section" id="f2">
    <div class="wrap">
      <div class="floor-header">
        <div class="floor-num">2F</div>
        <h2 class="floor-title serif">Member Plaza 會員休憩</h2>
      </div>
      <div class="md-content" id="render-2f">
        <!-- Markdown injected here -->
        <p class="menu-empty">讀取中...</p>
      </div>
    </div>
  </section>

  <!-- 3F -->
  <section class="floor-section" id="f3">
    <div class="wrap">
      <div class="floor-header">
        <div class="floor-num">3F</div>
        <h2 class="floor-title serif">Talent Lounge 共享辦公</h2>
      </div>
      <div class="md-content" id="render-3f">
        <!-- Markdown injected here -->
        <p class="menu-empty">讀取中...</p>
      </div>
    </div>
  </section>

</main>

<!--SITE_FOOTER-->

<script>
(function() {
  var CAT_LABEL = {
    COFFEE: { zh: '咖啡', en: 'Coffee' },
    BEVERAGE: { zh: '飲品', en: 'Beverage' },
    ALCOHOL: { zh: '酒精飲品', en: 'Alcohol' },
    FOOD: { zh: '餐點', en: 'Food' },
    SNACK: { zh: '點心', en: 'Snack' },
  };
  var esc = function (s) {
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var money = function (n) { return 'NT$' + Number(n || 0).toLocaleString('zh-TW'); };

  function renderMenuItem(item) {
    var showOrig = item.emo > 0 && item.emo !== item.price;
    var priceHtml = showOrig
      ? '<span class="now">' + money(item.emo) + '</span><span class="orig">原價 <s>' + money(item.price) + '</s></span>'
      : '<span class="now">' + money(item.price) + '</span>';
    return (
      '<li class="menu-item">' +
        '<div class="menu-item__names">' +
          '<span class="menu-item__zh">' + esc(item.zh) + '</span>' +
          (item.en ? '<span class="menu-item__en">' + esc(item.en) + '</span>' : '') +
          (item.note ? '<div class="menu-item__note">' + esc(item.note) + '</div>' : '') +
        '</div>' +
        '<div class="menu-item__price">' + priceHtml + '</div>' +
      '</li>'
    );
  }

  function renderMenu(items) {
    var root = document.getElementById('render-menu');
    if (!items || !items.length) { 
      root.innerHTML = '<p class="menu-empty">目前尚未提供菜單資料。</p>'; 
      return; 
    }
    var hasAlcohol = items.some(function (it) { return it.alcohol; });
    var byCat = {};
    var order = [];
    items.forEach(function (it) {
      if (!byCat[it.cat]) { byCat[it.cat] = []; order.push(it.cat); }
      byCat[it.cat].push(it);
    });
    var html = order.map(function (cat) {
      var label = CAT_LABEL[cat] || { zh: cat, en: '' };
      return (
        '<section class="menu-group">' +
          '<div class="menu-group__head">' +
            '<h3 class="menu-group__zh">' + esc(label.zh) + '</h3>' +
            '<span class="menu-group__en">' + esc(label.en) + '</span>' +
          '</div>' +
          '<ul class="menu-list">' + byCat[cat].map(renderMenuItem).join('') + '</ul>' +
        '</section>'
      );
    }).join('');
    if (hasAlcohol) {
      html += '<p class="menu-notice">未滿十八歲禁止飲酒。禁止酒駕。</p>';
    }
    root.innerHTML = html;
  }

  fetch('/api/public')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !d.content) return;
      
      // Render Markdown contents
      document.getElementById('render-1f').innerHTML = d.content.space_1f ? marked.parse(d.content.space_1f) : '<p class="menu-empty">準備中...</p>';
      document.getElementById('render-2f').innerHTML = d.content.space_2f ? marked.parse(d.content.space_2f) : '<p class="menu-empty">準備中...</p>';
      document.getElementById('render-3f').innerHTML = d.content.space_3f ? marked.parse(d.content.space_3f) : '<p class="menu-empty">準備中...</p>';
      
      // Render Menu
      var rawMenu = d.content.menu;
      if (rawMenu && window.MenuLib) {
        var doc = window.MenuLib.parseMenuDoc(rawMenu);
        var items = window.MenuLib.sortItems(window.MenuLib.publishedOnly(doc));
        renderMenu(items);
      } else {
        renderMenu([]);
      }
    })
    .catch(err => {
      console.error(err);
      ['render-1f','render-2f','render-3f','render-menu'].forEach(id => {
        document.getElementById(id).innerHTML = '<p class="menu-empty">無法載入資料。</p>';
      });
    });
})();
</script>
</body>
</html>
