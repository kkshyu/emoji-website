  .m-sub{color:var(--muted);margin-bottom:2rem}

  .m-row b{font-weight:500}
  .m-row span{color:var(--ink-soft)}
  .m-sec-title{font-family:var(--serif);font-size:1.15rem;margin:2.4rem 0 .8rem}
  .m-upd{padding:14px 0;border-top:1px solid var(--line)}
  .m-upd h4{font-weight:500;font-size:1rem;margin-bottom:.2em}

  .m-ev .meta{color:var(--muted);font-size:.82rem}
  .m-ev p{color:var(--ink-soft);font-size:.9rem;margin-top:.4em;white-space:pre-wrap}
  .m-ev .act{flex:0 0 auto;align-self:center}
  .m-ev .full{color:var(--muted);font-size:.85rem}
  .m-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:2.4rem}
  .m-google{display:inline-flex;align-items:center;gap:.7em}
  .m-google svg{width:20px;height:20px}
  .m-center{text-align:center}
  .m-note{color:var(--muted);font-size:.85rem;margin-top:1.2rem}
  .m-access{margin:1.4rem 0 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.44)}
  .m-access-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .m-access h3{font-family:var(--serif);font-size:1.15rem;margin:0 0 .25rem}
  .m-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.28em .75em;color:var(--ink-soft);font-size:.86rem;background:var(--paper)}
  .m-pill.on{border-color:var(--ink);color:var(--ink);background:rgba(255,222,52,.18)}
  .m-access-list{margin:.9rem 0 0;padding-left:1.15rem;color:var(--ink-soft);font-size:.92rem}
  .m-access-list li{margin:.32rem 0}
  .m-qr{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
  .m-qr img{display:block;margin:.8rem auto 0;border:1px solid var(--line);border-radius:12px;background:#fff}
  .m-token{display:block;margin-top:.6rem;padding:.8rem;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink-soft);font-size:.78rem;line-height:1.45;word-break:break-all;white-space:pre-wrap}

  .m-badge{display:inline-flex;align-items:center;gap:.65em;margin:.2rem 0 1.6rem;padding:.5em .95em .5em .55em;

  .m-badge .m-seal{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;

  .m-badge .m-bt{line-height:1.25}
  .m-badge .m-bt b{font-family:var(--serif);font-weight:700;letter-spacing:.04em}

  let qrEnabled = false;

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('token')) {
    localStorage.setItem(KEY, hash.get('token'));
    history.replaceState(null, '', location.pathname);

  const token = localStorage.getItem(KEY);

    if (!v) return '';
    const d = new Date(v);
    if (Number.isNaN(+d)) return String(v);
    return d.toLocaleString(T.locale, {
      timeZone: 'Asia/Taipei',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false,
    });
  }

  function entitlementLine(e, pending) {
    if (pending) return `${esc(planName(e.plan))}：${T.pendingActivate}`;
    const range = [fmtTime(e.starts_at), fmtTime(e.ends_at)].filter(Boolean).join(' – ');
    return `${esc(planName(e.plan))}${range ? '：' + esc(range) : ''}`;
  }

  function renderAccess(data) {
    const access = data.access || {};
    const activeEntitlements = Array.isArray(access.activeEntitlements) ? access.activeEntitlements : [];
    const pending = Array.isArray(access.pending) ? access.pending : [];
    const canIssueQr = activeEntitlements.length > 0 || pending.length > 0;
    const rows = [
      ...activeEntitlements.map(e => `<li>${entitlementLine(e, false)}</li>`),
      ...pending.map(e => `<li>${entitlementLine(e, true)}</li>`),
    ].join('') || `<li>${T.noFloorAccess}</li>`;
    const qr = canIssueQr
      ? `<div class="m-qr" id="m-qr">
           <b>${T.qrTitle}</b>
           <img id="m-qr-img" alt="${T.qrAlt}" width="200" height="200">
           <p class="m-note" id="m-qr-meta">${T.qrMaking}</p>
           <code class="m-token" id="m-qr-token">${T.generating}</code>
         </div>`
      : `<p class="m-note">${T.noQrYet}</p>`;
    return `<section class="m-access" aria-label="${T.accessLabel}">
      <div class="m-access-head">
        <div>
          <h3>${T.accessTitle}</h3>
          <p class="m-note" style="margin-top:0">${T.accessNote}</p>
        </div>
        <span class="m-pill${access.active ? ' on' : ''}">${access.active ? T.activeOn : T.activeOff}</span>
      </div>
      <ul class="m-access-list">${rows}</ul>
      ${qr}
    </section>`;
  }

  function stopQrRefresh() {
    qrEnabled = false;
    if (qrTimer) clearInterval(qrTimer);
    qrTimer = null;
  }

  function qrDataUrl(text) {
    return new Promise((resolve, reject) => {
      if (!window.QRCode || typeof window.QRCode.toDataURL !== 'function') {
        reject(new Error('QRCode unavailable'));
        return;
      }
      window.QRCode.toDataURL(text, { width: 200, margin: 1 }, (err, url) => {
        if (err) reject(err); else resolve(url);
      });
    });
  }

  async function refreshQr() {
    const img = document.getElementById('m-qr-img');
    const meta = document.getElementById('m-qr-meta');
    const tokenEl = document.getElementById('m-qr-token');
    if (!img || !meta || !tokenEl || !qrEnabled) return;
    try {
      const r = await fetch(FELLOW + '/api/me/access-qr', { headers: { authorization: 'Bearer ' + token } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        img.style.display = 'none';
        tokenEl.textContent = '';
        meta.textContent = d.error || T.qrFail;
        return;
      }
      img.style.display = '';
      img.src = await qrDataUrl(d.token);
      tokenEl.textContent = d.token || '';
      const exp = d.exp ? fmtTime(d.exp * 1000) : '';
      meta.textContent = `${planName(d.plan)}${d.pending_activation ? T.qrPending : ''}${exp ? T.qrUntil + exp : ''}`;
    } catch (e) {
      if (img) img.style.display = 'none';
      if (meta) meta.textContent = T.qrOffline;
    }
  }

  function startQrRefresh(enabled) {
    stopQrRefresh();
    if (!enabled) return;
    qrEnabled = true;
    refreshQr();
    qrTimer = setInterval(refreshQr, 30000);
  }

  function renderPoints(data) {
    const points = data.points || { balance: 0, lots: [] };
    const orders = Array.isArray(data.point_orders) ? data.point_orders : [];
    const active = !!(data.access && data.access.active);
    const packs = [
      { id: 'small', label: T.packSmall, pay: 500 },
      { id: 'mid', label: T.packMid, pay: 1000 },
      { id: 'large', label: T.packLarge, pay: 3000 },
      { id: 'xl', label: T.packXl, pay: 5000 },
    ];
    const packBtns = packs.map(p =>
      `<button class="btn btn--ghost" type="button" data-pack="${p.id}">${esc(p.label)}（NT$${p.pay}）</button>`
    ).join(' ');
    const soon = (points.lots || []).filter(l => l.available && l.expires_at).slice(0, 3)
      .map(l => `<li>${esc(T.ptsLot(l.type, l.remaining, fmtTime(l.expires_at)))}</li>`).join('');
    const redeem = active
      ? `<div class="m-actions" style="margin-top:1rem">
           <button class="btn btn--solid" type="button" data-redeem="shower">${T.redeemShower}</button>
           <button class="btn btn--ghost" type="button" data-redeem="capsule" data-hours="1">${T.redeemCapsule}</button>
           <button class="btn btn--ghost" type="button" data-redeem="entertainment" data-hours="1">${T.redeemEnt}</button>
         </div>`
      : `<p class="m-note">${T.needActive}</p>`;
    const orderRows = orders.filter(o => o.status === 'paid').map(o => {
      const purchaseLot = (points.lots || []).find(l => l.type === 'purchase' && l.source_id === o.id);
      const rem = purchaseLot ? purchaseLot.remaining : 0;
      return `<div class="m-row"><b>${esc(T.orderPaid(o.pack_id))}</b>
        <span>${T.orderRemain(rem)}
          ${rem > 0 ? `<button class="btn btn--ghost" type="button" data-refund="${esc(o.id)}" data-max="${rem}" style="margin-left:.5em;padding:.35em .8em">${T.refund}</button>` : ''}
        </span></div>`;
    }).join('') || `<div class="m-empty">${T.noOrders}</div>`;
    return `<section class="m-access" aria-label="${T.walletLabel}" style="margin-top:1.4rem">
      <div class="m-access-head">
        <div>
          <h3>${T.walletTitle}</h3>
          <p class="m-note" style="margin-top:0">${T.walletNote}</p>
        </div>
        <span class="m-pill on">${T.ptsUnit(Number(points.balance) || 0)}</span>
      </div>
      ${soon ? `<ul class="m-access-list"><li><b>${T.expiring}</b></li>${soon}</ul>` : ''}
      <h4 class="m-sec-title" style="margin-top:1.2rem;font-size:1rem">${T.buyPts}</h4>
      <div class="m-actions" style="margin-top:.6rem">${packBtns}</div>
      <h4 class="m-sec-title" style="margin-top:1.2rem;font-size:1rem">${T.redeemSvc}</h4>
      ${redeem}
      <h4 class="m-sec-title" style="margin-top:1.2rem;font-size:1rem">${T.ordersRefund}</h4>
      ${orderRows}
    </section>`;
  }

  function renderLoggedOut() {
    stopQrRefresh();
    card.innerHTML = `
      <div class="m-center">
        <h1 class="m-hi">${T.loginTitle}</h1>
        <p class="m-sub">${T.loginSub}</p>
        ${loginBtn(location.origin + MEMBER_PATH)}
        <p class="m-note">${T.loginNote}</p>
      </div>`;
  }

  function renderMember(data) {
    const me = data.me || {};
    const c = (data.commitments || [])[0];
    const badge = c
      ? `<div class="m-badge" title="${T.badgeTitle}">
           <span class="m-seal">創</span>
           <span class="m-bt"><b>${T.badgeName}</b> Founding Member<small>${esc(c.cert_no || '')}${c.membership_status ? '　·　' + esc(c.membership_status) : ''}</small></span>
         </div>`
      : '';
    const membership = c
      ? `<div class="m-row"><b>${T.memStatus}</b><span>${esc(c.membership_status || '—')}</span></div>
         <div class="m-row"><b>${T.memNo}</b><span>${esc(c.cert_no || '—')}</span></div>
         <div class="m-row"><b>${T.memPeriod}</b><span>${esc(c.start_date)} – ${esc(c.maturity_date)}</span></div>`
      : `<div class="m-row"><b>${T.memStatus}</b><span>${T.notJoined}</span></div>
         <div class="m-empty">${T.notFounder}
           <a href="${FELLOW_PATH}" style="text-decoration:underline;text-underline-offset:3px">${T.joinFounder}</a></div>`;

    const updates = (data.updates || []).map(u => `
      <div class="m-upd"><h4>${esc(u.title)}</h4><time>${esc(u.published_at)}｜${esc(u.type)}</time>
        ${u.content ? `<p>${esc(u.content)}</p>` : ''}</div>`).join('')
      || `<div class="m-empty">${T.noUpdates}</div>`;

    const events = (data.events || []).map(e => {
      const full = e.capacity > 0 && e.reg_count >= e.capacity && !e.registered;
      const cap = e.capacity > 0 ? T.cap(e.reg_count, e.capacity) : T.regCount(e.reg_count);
      const btn = e.registered
        ? `<button class="btn btn--ghost" data-unreg="${e.id}">${T.cancelReg}</button>`
        : full ? `<span class="full">${T.full}</span>`
        : `<button class="btn btn--solid" data-reg="${e.id}">${T.register}</button>`;
      return `<div class="m-ev">
        <div><h4>${esc(e.title)}${e.registered ? '　<span style="color:var(--muted);font-size:.82rem">' + T.registered + '</span>' : ''}</h4>
          <div class="meta">${esc(e.starts_at || T.timeTbd)}${e.location ? '｜' + esc(e.location) : ''}　·　${cap}</div>
          ${e.description ? `<p>${esc(e.description)}</p>` : ''}</div>
        <div class="act">${btn}</div></div>`;
    }).join('') || `<div class="m-empty">${T.noEvents}</div>`;

    const access = data.access || {};
    const canIssueQr = !!(access.active || (access.activeEntitlements || []).length || (access.pending || []).length);
    card.innerHTML = `
      <h1 class="m-hi">${T.welcome(esc(me.name))}</h1>
      <p class="m-sub">${esc(me.email || '')}</p>
      ${data.role === 'admin' ? `<div style="margin:0 0 1.4rem"><a class="btn btn--solid" href="/admin">${T.goAdmin}</a></div>` : ''}
      ${badge}
      ${renderAccess(data)}
      ${renderPoints(data)}
      <div>${membership}</div>
      <h3 class="m-sec-title">${T.eventsTitle}</h3>
      <div>${events}</div>
      <h3 class="m-sec-title">${T.updatesTitle}</h3>
      <div>${updates}</div>
      <div class="m-actions">
        <button class="btn btn--ghost" id="logout">${T.logout}</button>
      </div>`;
    if (me.name) try { localStorage.setItem('tth_name', me.name); } catch (e) {}
    document.getElementById('logout').onclick = () => {
      localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); location.reload();
    };
    card.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => regEvent(b.dataset.reg, 'POST', b));
    card.querySelectorAll('[data-unreg]').forEach(b => b.onclick = () => regEvent(b.dataset.unreg, 'DELETE', b));
    card.querySelectorAll('[data-pack]').forEach(b => b.onclick = () => buyPack(b.dataset.pack, b));
    card.querySelectorAll('[data-redeem]').forEach(b => b.onclick = () => redeemService(b.dataset.redeem, Number(b.dataset.hours || 1), b));
    card.querySelectorAll('[data-refund]').forEach(b => b.onclick = () => refundPoints(b.dataset.refund, Number(b.dataset.max), b));
    startQrRefresh(canIssueQr);
  }

  async function buyPack(packId, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(FELLOW + '/api/me/points/orders', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify({ pack_id: packId, lang: LANG }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || T.buyFail); btn.disabled = false; return; }
      location.href = d.url;
    } catch (e) {
      alert(T.netFail);
      btn.disabled = false;
    }
  }

  async function redeemService(service, hours, btn) {
    btn.disabled = true;
    try {
      const body = service === 'shower' ? { service } : { service, hours };
      const r = await fetch(FELLOW + '/api/me/points/redeem', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || T.redeemFail); btn.disabled = false; return; }
      await main();
    } catch (e) {
      alert(T.netFail);
      btn.disabled = false;
    }
  }

  async function refundPoints(orderId, max, btn) {
    const raw = prompt(T.refundPrompt(max), String(max));
    if (raw == null) return;
    const n = Number(raw);
    if (!Number.isInteger(n) || n < 1 || n > max) { alert(T.refundBad(max)); return; }
    btn.disabled = true;
    try {
      const r = await fetch(FELLOW + '/api/me/points/refunds', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify({ point_order_id: orderId, principal_points: n }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || T.refundFail); btn.disabled = false; return; }
      alert(T.refundOk(d.refund?.refund_twd || n * 10));
      await main();
    } catch (e) {
      alert(T.netFail);
      btn.disabled = false;
    }
  }

  async function fulfillPointsIfNeeded() {
    const q = new URLSearchParams(location.search);
    if (q.get('points_paid') !== '1') return;
    const oid = q.get('oid');
    const s = q.get('s');
    history.replaceState(null, '', location.pathname);
    if (!oid || !token) return;
    try {
      await fetch(FELLOW + '/api/me/points/orders/' + encodeURIComponent(oid) + '/fulfill', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
        body: JSON.stringify({ session_id: s }),
      });
    } catch (e) {}
  }

  async function regEvent(id, method, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(FELLOW + '/api/events/' + id + '/register', {
        method, headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || T.opFail); btn.disabled = false; return; }
      main();
    } catch (e) { alert(T.tempFail); btn.disabled = false; }
  }

  async function main() {
    if (!token) return renderLoggedOut();
    try {
      await fulfillPointsIfNeeded();
      const r = await fetch(FELLOW + '/api/state', { headers: { authorization: 'Bearer ' + token } });
      if (r.status === 401) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); return renderLoggedOut(); }
      if (!r.ok) throw new Error('state ' + r.status);
      renderMember(await r.json());
    } catch (e) {
      stopQrRefresh();
      card.innerHTML = `<p class="m-center" style="color:var(--muted)">
        ${T.sysFail}<br>
        <button class="btn btn--ghost" style="margin-top:1.2rem" onclick="location.reload()">${T.reload}</button></p>`;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshQr();
  });
  // set document title by lang
  if (LANG === 'en') document.title = 'Member area · Emoji - Taiwan Talent Hub';
  else if (LANG === 'ja') document.title = '会員エリア｜言文字｜台湾タレントハブ';
  else document.title = '會員專區 · 言文字｜台灣人才聚落';
  const loading = card.querySelector('p');
  if (loading) loading.textContent = T.loading;
  main();
</script>
</body>
</html>
