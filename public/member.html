<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員專區 · 言文字｜台灣人才聚落</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  /* member 專頁：沿用 CIS token，僅補版面 */
  .m-wrap{max-width:760px;margin:0 auto;padding:120px 24px 96px}
  .m-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:40px 36px}
  .m-hi{font-family:var(--serif);font-size:1.7rem;font-weight:500;margin-bottom:.2em}
  .m-sub{color:var(--muted);margin-bottom:2rem}
  .m-row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
  .m-row b{font-weight:500}
  .m-row span{color:var(--ink-soft)}
  .m-sec-title{font-family:var(--serif);font-size:1.15rem;margin:2.4rem 0 .8rem}
  .m-upd{padding:14px 0;border-top:1px solid var(--line)}
  .m-upd h4{font-weight:500;font-size:1rem;margin-bottom:.2em}
  .m-upd time{color:var(--muted);font-size:.82rem}
  .m-upd p{color:var(--ink-soft);font-size:.94rem;margin-top:.4em;white-space:pre-wrap}
  .m-empty{color:var(--muted);padding:14px 0;border-top:1px solid var(--line)}
  .m-ev{padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .m-ev h4{font-weight:500;font-size:1rem;margin-bottom:.2em}
  .m-ev .meta{color:var(--muted);font-size:.82rem}
  .m-ev p{color:var(--ink-soft);font-size:.9rem;margin-top:.4em;white-space:pre-wrap}
  .m-ev .act{flex:0 0 auto;align-self:center}
  .m-ev .full{color:var(--muted);font-size:.85rem}
  .m-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:2.4rem}
  .m-google{display:inline-flex;align-items:center;gap:.7em}
  .m-google svg{width:20px;height:20px}
  .m-center{text-align:center}
  .m-note{color:var(--muted);font-size:.85rem;margin-top:1.2rem}
  .m-access{margin:1.4rem 0 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.44)}
  .m-access-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .m-access h3{font-family:var(--serif);font-size:1.15rem;margin:0 0 .25rem}
  .m-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.28em .75em;color:var(--ink-soft);font-size:.86rem;background:var(--paper)}
  .m-pill.on{border-color:var(--ink);color:var(--ink);background:rgba(255,222,52,.18)}
  .m-access-list{margin:.9rem 0 0;padding-left:1.15rem;color:var(--ink-soft);font-size:.92rem}
  .m-access-list li{margin:.32rem 0}
  .m-qr{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
  .m-qr img{display:block;margin:.8rem auto 0;border:1px solid var(--line);border-radius:12px;background:#fff}
  .m-token{display:block;margin-top:.6rem;padding:.8rem;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink-soft);font-size:.78rem;line-height:1.45;word-break:break-all;white-space:pre-wrap}
  /* 創始會員勳章（CIS：印章＋唯一黃） */
  .m-badge{display:inline-flex;align-items:center;gap:.65em;margin:.2rem 0 1.6rem;padding:.5em .95em .5em .55em;
    border:1px solid var(--ink);border-radius:999px;background:rgba(255,222,52,.18)}
  .m-badge .m-seal{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;
    background:#FFDE34;color:#1B1A17;font-family:var(--serif);font-weight:700;font-size:1rem;border:1px solid #1B1A17}
  .m-badge .m-bt{line-height:1.25}
  .m-badge .m-bt b{font-family:var(--serif);font-weight:700;letter-spacing:.04em}
  .m-badge .m-bt small{display:block;color:var(--muted);font-size:.76rem;letter-spacing:.02em}
  .m-top{position:fixed;top:0;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:10}
  .m-top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .m-brand b{font-family:var(--serif);font-weight:700;font-size:1.1rem}
  .m-brand span{color:var(--muted);font-size:.8rem;margin-left:.6em}
  .m-wrap{min-height:calc(100vh - 64px - 88px)}   /* 讓頁尾貼底，卡片不再孤懸空頁 */
  .m-foot{border-top:1px solid var(--line);padding:28px 24px;text-align:center;color:var(--muted);font-size:.8rem}
  .m-foot a{color:var(--ink-soft);text-decoration:none}
  .m-foot a:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<header class="m-top">
  <div class="wrap">
    <a class="m-brand" href="/"><b>言文字</b><span>會員專區</span></a>
    <a href="/" class="btn btn--ghost" style="padding:.55em 1.1em">← 回首頁</a>
  </div>
</header>

<main class="m-wrap">
  <div class="m-card" id="card">
    <p class="m-center" style="color:var(--muted)">載入中…</p>
  </div>
</main>

<footer class="m-foot">
  言文字｜台灣人才聚落 · <a href="/">回首頁</a> · <a href="mailto:us@emoji.tw">us@emoji.tw</a><br>
  © 2026 言文字 Taiwan Talent Hub
</footer>

<script src="/vendor/qrcode.min.js"></script>
<script>
  // 後端與官網同源（www.emoji.tw），一律走相對路徑
  const FELLOW = '';
  const KEY = 'tth_token';
  const card = document.getElementById('card');
  const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let qrTimer = null;
  let qrEnabled = false;

  // 1) 從 Google 導回時，token 夾在網址 fragment，讀出後即從網址移除
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('token')) {
    localStorage.setItem(KEY, hash.get('token'));
    history.replaceState(null, '', location.pathname);
  }
  const token = localStorage.getItem(KEY);

  const loginBtn = redirect =>
    `<a class="btn btn--solid m-google" href="${FELLOW}/auth/google?redirect=${encodeURIComponent(redirect)}">
       <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.3 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.3-4.6 6.9l7.1 5.5c4.1-3.8 6.5-9.4 6.5-16z"/><path fill="#FBBC05" d="M10.5 28.3c-.5-1.4-.8-2.9-.8-4.3s.3-3 .8-4.3l-7.9-6.1C1 16.9 0 20.3 0 24s1 7.1 2.6 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.1 0 11.3-2 15-5.5l-7.1-5.5c-2 1.3-4.6 2.1-7.9 2.1-6.4 0-11.7-3.7-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
       使用 Google 登入
     </a>`;

  const planName = p => ({
    day_4h: '單日 4 小時',
    day_12h: '單日 12 小時',
    month: '月票',
    quarter: '季票',
    year: '年票',
    founding: '創始會員',
  }[p] || p || '權益');

  function fmtTime(v) {
    if (!v) return '';
    const d = new Date(v);
    if (Number.isNaN(+d)) return String(v);
    return d.toLocaleString('zh-TW', {
      timeZone: 'Asia/Taipei',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
  }

  function entitlementLine(e, pending) {
    if (pending) return `${esc(planName(e.plan))}：待首次進場啟用`;
    const range = [fmtTime(e.starts_at), fmtTime(e.ends_at)].filter(Boolean).join(' – ');
    return `${esc(planName(e.plan))}${range ? '：' + esc(range) : ''}`;
  }

  function renderAccess(data) {
    const access = data.access || {};
    const activeEntitlements = Array.isArray(access.activeEntitlements) ? access.activeEntitlements : [];
    const pending = Array.isArray(access.pending) ? access.pending : [];
    const canIssueQr = activeEntitlements.length > 0 || pending.length > 0;
    const rows = [
      ...activeEntitlements.map(e => `<li>${entitlementLine(e, false)}</li>`),
      ...pending.map(e => `<li>${entitlementLine(e, true)}</li>`),
    ].join('') || '<li>目前沒有可進出二三樓的權益。</li>';
    const qr = canIssueQr
      ? `<div class="m-qr" id="m-qr">
           <b>進出 QR</b>
           <img id="m-qr-img" alt="進出 QR" width="200" height="200">
           <p class="m-note" id="m-qr-meta">正在產生短效 QR…</p>
           <code class="m-token" id="m-qr-token">產生中…</code>
         </div>`
      : `<p class="m-note">尚無有效或待啟用權益，因此目前無法進出二三樓。</p>`;
    return `<section class="m-access" aria-label="進出二三樓狀態">
      <div class="m-access-head">
        <div>
          <h3>進出二三樓</h3>
          <p class="m-note" style="margin-top:0">會員 QR 每 30 秒自動更新，必要時可複製下方 token 備用。</p>
        </div>
        <span class="m-pill${access.active ? ' on' : ''}">${access.active ? 'Active（可進出二三樓）' : '非 Active'}</span>
      </div>
      <ul class="m-access-list">${rows}</ul>
      ${qr}
    </section>`;
  }

  function stopQrRefresh() {
    qrEnabled = false;
    if (qrTimer) clearInterval(qrTimer);
    qrTimer = null;
  }

  function qrDataUrl(text) {
    return new Promise((resolve, reject) => {
      if (!window.QRCode || typeof window.QRCode.toDataURL !== 'function') {
        reject(new Error('QRCode unavailable'));
        return;
      }
      window.QRCode.toDataURL(text, { width: 200, margin: 1 }, (err, url) => {
        if (err) reject(err);
        else resolve(url);
      });
    });
  }

  async function refreshQr() {
    const img = document.getElementById('m-qr-img');
    const meta = document.getElementById('m-qr-meta');
    const tokenEl = document.getElementById('m-qr-token');
    if (!img || !meta || !tokenEl || !qrEnabled) return;
    try {
      const r = await fetch(FELLOW + '/api/me/access-qr', { headers: { authorization: 'Bearer ' + token } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        img.style.display = 'none';
        tokenEl.textContent = '';
        meta.textContent = d.error || '目前無法產生進出 QR';
        return;
      }
      img.style.display = '';
      img.src = await qrDataUrl(d.token);
      tokenEl.textContent = d.token || '';
      const exp = d.exp ? fmtTime(d.exp * 1000) : '';
      meta.textContent = `${planName(d.plan)}${d.pending_activation ? '（待首次進場啟用）' : ''}${exp ? '，有效至 ' + exp : ''}`;
    } catch (e) {
      if (img) img.style.display = 'none';
      if (meta) meta.textContent = '暫時無法連線產生 QR，請稍後再試。';
    }
  }

  function startQrRefresh(enabled) {
    stopQrRefresh();
    if (!enabled) return;
    qrEnabled = true;
    refreshQr();
    qrTimer = setInterval(refreshQr, 30000);
  }

  function renderLoggedOut() {
    stopQrRefresh();
    card.innerHTML = `
      <div class="m-center">
        <h1 class="m-hi">會員登入</h1>
        <p class="m-sub">登入後可查看你的會籍狀態與會員專屬動態。</p>
        ${loginBtn(location.origin + '/member')}
        <p class="m-note">使用 Google 帳號一鍵登入，我們只讀取你的姓名與 Email。</p>
      </div>`;
  }

  function renderMember(data) {
    const me = data.me || {};
    const c = (data.commitments || [])[0];
    // 參與創始會員計畫者，於會員頁顯示創始勳章
    const badge = c
      ? `<div class="m-badge" title="創始會員計畫參與者">
           <span class="m-seal">創</span>
           <span class="m-bt"><b>創始會員</b> Founding Member<small>${esc(c.cert_no || '')}${c.membership_status ? '　·　' + esc(c.membership_status) : ''}</small></span>
         </div>`
      : '';
    const membership = c
      ? `<div class="m-row"><b>會籍狀態</b><span>${esc(c.membership_status || '—')}</span></div>
         <div class="m-row"><b>會員編號</b><span>${esc(c.cert_no || '—')}</span></div>
         <div class="m-row"><b>會籍期間</b><span>${esc(c.start_date)} – ${esc(c.maturity_date)}</span></div>`
      : `<div class="m-row"><b>會籍狀態</b><span>尚未加入</span></div>
         <div class="m-empty">你目前尚未成為創始會員。
           <a href="/fellow" style="text-decoration:underline;text-underline-offset:3px">前往加入創始會員 →</a></div>`;

    const updates = (data.updates || []).map(u => `
      <div class="m-upd"><h4>${esc(u.title)}</h4><time>${esc(u.published_at)}｜${esc(u.type)}</time>
        ${u.content ? `<p>${esc(u.content)}</p>` : ''}</div>`).join('')
      || `<div class="m-empty">目前尚無會員動態。</div>`;

    const events = (data.events || []).map(e => {
      const full = e.capacity > 0 && e.reg_count >= e.capacity && !e.registered;
      const cap = e.capacity > 0 ? `名額 ${e.reg_count}／${e.capacity}` : `已報名 ${e.reg_count} 人`;
      const btn = e.registered
        ? `<button class="btn btn--ghost" data-unreg="${e.id}">取消報名</button>`
        : full ? `<span class="full">名額已滿</span>`
        : `<button class="btn btn--solid" data-reg="${e.id}">報名</button>`;
      return `<div class="m-ev">
        <div><h4>${esc(e.title)}${e.registered ? '　<span style="color:var(--muted);font-size:.82rem">✓ 已報名</span>' : ''}</h4>
          <div class="meta">${esc(e.starts_at || '時間待定')}${e.location ? '｜' + esc(e.location) : ''}　·　${cap}</div>
          ${e.description ? `<p>${esc(e.description)}</p>` : ''}</div>
        <div class="act">${btn}</div></div>`;
    }).join('') || `<div class="m-empty">目前沒有開放報名的活動。</div>`;

    const access = data.access || {};
    const canIssueQr = !!(access.active || (access.activeEntitlements || []).length || (access.pending || []).length);
    card.innerHTML = `
      <h1 class="m-hi">歡迎，${esc(me.name || '會員')}</h1>
      <p class="m-sub">${esc(me.email || '')}</p>
      ${data.role === 'admin' ? `<div style="margin:0 0 1.4rem"><a class="btn btn--solid" href="/admin">前往後台管理 →</a></div>` : ''}
      ${badge}
      ${renderAccess(data)}
      <div>${membership}</div>
      <h3 class="m-sec-title">近期活動</h3>
      <div>${events}</div>
      <h3 class="m-sec-title">會員動態</h3>
      <div>${updates}</div>
      <div class="m-actions">
        <button class="btn btn--ghost" id="logout">登出</button>
      </div>`;
    if (me.name) try { localStorage.setItem('tth_name', me.name); } catch (e) {}
    document.getElementById('logout').onclick = () => {
      localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); location.reload();
    };
    card.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => regEvent(b.dataset.reg, 'POST', b));
    card.querySelectorAll('[data-unreg]').forEach(b => b.onclick = () => regEvent(b.dataset.unreg, 'DELETE', b));
    startQrRefresh(canIssueQr);
  }

  async function regEvent(id, method, btn) {
    btn.disabled = true;
    try {
      const r = await fetch(FELLOW + '/api/events/' + id + '/register', {
        method, headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' },
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { alert(d.error || '操作失敗，請稍後再試。'); btn.disabled = false; return; }
      main();   // 重新載入狀態，更新報名/名額
    } catch (e) { alert('暫時無法連線，請稍後再試。'); btn.disabled = false; }
  }

  async function main() {
    if (!token) return renderLoggedOut();
    try {
      const r = await fetch(FELLOW + '/api/state', { headers: { authorization: 'Bearer ' + token } });
      if (r.status === 401) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); return renderLoggedOut(); }
      if (!r.ok) throw new Error('state ' + r.status);
      renderMember(await r.json());
    } catch (e) {
      stopQrRefresh();
      card.innerHTML = `<p class="m-center" style="color:var(--muted)">
        暫時無法連線會員系統，請稍後再試。<br>
        <button class="btn btn--ghost" style="margin-top:1.2rem" onclick="location.reload()">重新整理</button></p>`;
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshQr();
  });
  main();
</script>
</body>
</html>
