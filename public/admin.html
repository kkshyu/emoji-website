<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理 · 言文字｜台灣人才聚落</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  /* 後台：沿用 CIS token（/style.css），內部工具、務實不華 */
  .a-top{position:fixed;top:0;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:20}
  .a-top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
  .a-brand b{font-family:var(--serif);font-weight:700;font-size:1.06rem}
  .a-brand span{color:var(--muted);font-size:.78rem;margin-left:.6em}
  /* 版面：側欄分頁 + 內容 */
  .a-shell{max-width:1180px;margin:0 auto;padding:78px 24px 80px;display:grid;grid-template-columns:200px 1fr;gap:28px}
  .a-nav{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:2px}
  .a-nav button{all:unset;cursor:pointer;padding:.6em .9em;border-radius:10px;color:var(--ink-soft);font-size:.92rem;display:flex;align-items:center;justify-content:space-between;gap:.5em}
  .a-nav button:hover{background:var(--card)}
  .a-nav button.on{background:var(--ink);color:var(--paper);font-weight:500}
  .a-nav .badge{font-size:.7rem;background:var(--accent,#FFDE34);color:#1B1A17;border-radius:999px;padding:.05em .5em;font-weight:600}
  .a-nav button.on .badge{background:var(--paper);color:var(--ink)}
  .a-main{min-width:0}
  .a-h1{font-family:var(--serif);font-size:1.5rem;font-weight:500;margin-bottom:.1em}
  .a-sub{color:var(--muted);margin-bottom:1.6rem;font-size:.9rem}
  .a-tab{display:none}.a-tab.on{display:block;animation:fade .2s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .a-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:1.8rem}
  .a-kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .a-kpi .kl{color:var(--muted);font-size:.78rem;letter-spacing:.04em}
  .a-kpi .kv{font-family:var(--serif);font-size:1.5rem;font-weight:500;margin-top:.2em}
  .a-kpi .kv .u{font-size:.8rem;color:var(--muted);font-family:var(--sans);margin-right:.15em}
  .a-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
  .a-sec h2{font-family:var(--serif);font-size:1.1rem;font-weight:500;margin-bottom:.3rem;display:flex;align-items:center;gap:.5em}
  .a-sec .hint{color:var(--muted);font-size:.82rem;margin-bottom:1rem}
  table.a-tbl{width:100%;border-collapse:collapse;font-size:.9rem}
  table.a-tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:.76rem;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.a-tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  table.a-tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
  .a-wrap2{overflow-x:auto}
  .a-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
  .a-form label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:.25em}
  .a-form input,.a-form select,.a-form textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  .a-form textarea{width:100%;min-height:64px;resize:vertical}
  .a-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .a-toolbar input,.a-toolbar select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  .a-toolbar input[type=search]{flex:1;min-width:180px}
  .pill{display:inline-block;font-size:.76rem;padding:.15em .6em;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pill-ok{background:rgba(255,222,52,.2);border-color:transparent}
  .pill-wait{color:var(--muted)}
  .pill-draft{color:var(--muted)}
  .pill-live{background:rgba(255,222,52,.2);border-color:transparent}
  .pill-done{color:var(--muted);text-decoration:line-through}
  .a-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem}
  .a-empty{color:var(--muted);padding:14px 0}
  .btn-sm{padding:.5em 1em;font-size:.85rem}
  .a-regs{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .a-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--paper);padding:.8em 1.4em;border-radius:999px;font-size:.9rem;
    transition:.25s;pointer-events:none;z-index:50}
  .a-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .a-center{text-align:center;padding:60px 0;color:var(--muted)}
  /* 社群經營分頁 */
  .sp-h3{font-family:var(--serif);font-size:1.02rem;margin:22px 0 10px;display:flex;align-items:center}
  /* 貼文日曆：月曆格 */
  .sp-cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .sp-cal-h b{font-family:var(--serif);font-weight:500;font-size:1.05rem;min-width:6.5em;text-align:center}
  .sp-cal-wrap{overflow-x:auto}
  .sp-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:660px}
  .sp-cal-wd{background:var(--card);padding:7px 8px;text-align:center;font-size:.74rem;color:var(--muted);letter-spacing:.06em}
  .sp-cal-d{background:var(--paper);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .sp-cal-d.out{background:var(--card)}
  .sp-cal-d.out .sp-cal-n{opacity:.45}
  .sp-cal-n{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.7;padding:0 .2em}
  .sp-cal-d.today .sp-cal-n{background:var(--ink);color:var(--paper);border-radius:999px;min-width:1.7em;height:1.7em;
    display:inline-grid;place-items:center;font-weight:600;padding:0}
  .sp-ev-head{display:flex;gap:5px;align-items:center;min-width:0}
  .sp-ev-thumb{display:block;width:100%;aspect-ratio:4/5;background:var(--line);overflow:hidden;position:relative;border-radius:3px}
  .sp-ev-thumb>.igp{position:absolute;top:0;left:0;transform-origin:top left}
  .sp-ev-sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;
    font-size:.66rem;color:var(--muted);line-height:1.35}
  .sp-ev{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;flex-direction:column;gap:4px;
    border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:6px;background:var(--card);
    padding:3px 5px;font-size:.72rem;line-height:1.35}
  .sp-ev:hover{border-color:var(--ink);border-left-color:var(--ink)}
  .sp-ev-p{font-weight:700;font-size:.64rem;color:var(--muted);flex:none}
  .sp-ev-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sp-ev--scheduled{border-left-color:var(--accent,#FFDE34)}
  .sp-ev--published{border-left-color:var(--ink)}
  .sp-ev--draft{border-left-color:var(--line)}
  .sp-edit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
  .sp-side{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--card);position:sticky;top:12px}
  .sp-ul{margin:.4em 0 .8em;padding-left:1.2em;font-size:.85rem}
  .sp-ul li{margin:.2em 0}
  .sp-page{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;border:1px solid var(--line);
    border-radius:var(--radius);padding:12px;margin-bottom:12px;background:var(--card)}
  .sp-page-prev{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
  .sp-page-ops{display:flex;gap:4px;align-items:center;margin-top:6px}
  .sp-page-form label{font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:.25em;margin-bottom:8px}
  .sp-page-form input,.sp-page-form select,.sp-page-form textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  .sp-imgs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .sp-img{position:relative;display:inline-block}
  .sp-img img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .sp-img button{position:absolute;top:-6px;right:-6px;border:1px solid var(--line);border-radius:999px;
    background:var(--paper);cursor:pointer;font-size:.7rem;line-height:1.4}
  #social-body select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  @media(max-width:1020px){.sp-edit{grid-template-columns:1fr}.sp-side{position:static}}
  @media(max-width:860px){
    .a-shell{grid-template-columns:1fr;gap:14px}
    .a-nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
    .a-nav button{white-space:nowrap;border:1px solid var(--line)}
    /* 窄螢幕：表格改為水平捲動，不再壓縮欄寬把中文擠成直排 */
    .a-wrap2 table.a-tbl{min-width:640px}
    .a-wrap2 table.a-tbl td{white-space:nowrap}
  }
</style>
</head>
<body>
<header class="a-top">
  <div class="wrap">
    <a class="a-brand" href="/"><b>言文字</b><span>後台管理</span></a>
    <div style="display:flex;align-items:center;gap:.5em">
      <a class="btn btn--ghost btn-sm" href="/">回前台</a>
      <button class="btn btn--ghost btn-sm" id="logout" style="display:none">登出</button>
    </div>
  </div>
</header>

<main>
  <div id="app"><p class="a-center">載入中…</p></div>
</main>
<div class="a-toast" id="toast"></div>

<script src="/menu-lib.js"></script>
<script>
'use strict';
const KEY = 'tth_token';
const app = document.getElementById('app');
const logoutBtn = document.getElementById('logout');
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NT = n => 'NT$' + Number(n || 0).toLocaleString('en-US');
const num = n => Number(n || 0).toLocaleString('en-US');
let toastT, DATA = null, TAB = 'overview';
let MENU_DOC = null;
let MENU_DIRTY = false;
let MENU_DIRTY_TOASTED = false;
let MENU_SEEDED = false;
/* 社群經營分頁狀態（資料按需載入；編輯狀態存全域，refresh 重繪不遺失） */
let SOCIAL_POSTS = null;          // null=未載入
let SOCIAL_VIEW = 'list';         // list | calendar | ads | edit
let SOCIAL_EDIT = null;           // 編輯中的貼文（複本）
let SOCIAL_DIRTY = false;
let SOCIAL_FILTER = { platform:'', status:'', q:'' };
let SOCIAL_CAL_MONTH = null;      // 日曆顯示月份 'YYYY-MM'；null=自動
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

// datetime-local 值 ↔ ISO
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

// Google 導回時 token 夾在 fragment
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('token')) { localStorage.setItem(KEY, hash.get('token')); history.replaceState(null,'',location.pathname); }
let token = localStorage.getItem(KEY);

async function api(path, { method='GET', body } = {}) {
  const res = await fetch('/api'+path, {
    method, headers:{ 'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let d={}; try{ d=await res.json(); }catch(e){}
  if (!res.ok) throw new Error(d.error || ('伺服器錯誤（'+res.status+'）'));
  return d;
}

logoutBtn.onclick = () => { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); location.reload(); };

function renderLogin(msg){
  logoutBtn.style.display='none';
  const redirect = encodeURIComponent(location.origin + '/admin.html');
  app.innerHTML = `<div class="a-center" style="max-width:460px;margin:0 auto">
    <h1 class="a-h1">後台管理登入</h1>
    <p class="a-sub">${msg || '請以管理員 Google 帳號登入。'}</p>
    <a class="btn btn--solid" href="/auth/google?redirect=${redirect}">使用 Google 登入</a>
  </div>`;
}

/* ---------- CSV 匯出（純前端） ---------- */
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    let s = c == null ? '' : String(c);
    // 防公式注入：以 = + - @ 或 tab/CR 開頭的儲存格前綴單引號，避免試算表當公式執行
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});   // BOM 讓 Excel 正確辨識 UTF-8
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 衍生資料 ---------- */
function derived(d){
  const paid = d.commitments.filter(c=>c.payment_status==='已付款');
  const joined = new Set(paid.map(c=>c.user_id)).size;
  const pending = d.commitments.filter(c=>c.payment_status!=='已付款').reduce((s,c)=>s+Number(c.amount),0);
  const people = new Set(d.commitments.map(c=>c.user_id)).size;
  const cByUser = {}; d.commitments.forEach(c=>{ if(!cByUser[c.user_id]) cByUser[c.user_id]=c; });
  return { joined, pending, people, cByUser };
}

/* ---------- 菜單（site_content.menu） ---------- */
function ensureMenuDoc(d) {
  const raw = d.content && d.content.menu;
  if (typeof raw === 'string' && raw.trim()) {
    MENU_SEEDED = false;
    return MenuLib.parseMenuDoc(raw);
  }
  const seed = window.__MENU_SEED || window.MENU_DATA;
  if (seed) {
    MENU_SEEDED = true;
    return MenuLib.fromSeedRows(seed);
  }
  MENU_SEEDED = false;
  return MenuLib.parseMenuDoc('');
}

// IG 產生器讀 window.MENU_DATA；每次 MENU_DOC 有更新都要同步，確保帶入的是目前顯示中的清單（含未存檔編輯）。
function syncWindowMenuData() {
  const items = MENU_DOC && Array.isArray(MENU_DOC.items)
    ? MENU_DOC.items
    : MenuLib.fromSeedRows(window.__MENU_SEED || window.MENU_DATA || []).items;
  window.MENU_DATA = MenuLib.sortItems(items);
  window.dispatchEvent(new Event('tth:menu-data'));
}

/* ---------- 各分頁 ---------- */
function tabOverview(d, x){
  return `
  <div class="a-kpis">
    <div class="a-kpi"><div class="kl">已收會費</div><div class="kv"><span class="u">NT$</span>${num(d.bond.raised)}</div></div>
    <div class="a-kpi"><div class="kl">創始名額</div><div class="kv">${x.joined}<span class="u"> ／100</span></div></div>
    <div class="a-kpi"><div class="kl">待入帳</div><div class="kv"><span class="u">NT$</span>${num(x.pending)}</div></div>
    <div class="a-kpi"><div class="kl">入會人數</div><div class="kv">${x.people}<span class="u"> 人</span></div></div>
    <div class="a-kpi"><div class="kl">使用者</div><div class="kv">${(d.users||[]).length}<span class="u"> 人</span></div></div>
    <div class="a-kpi"><div class="kl">活動場次</div><div class="kv">${(d.events||[]).length}<span class="u"> 場</span></div></div>
  </div>
  <div class="a-sec">
    <h2>快速指引</h2>
    <p class="hint">此後台管理創始會員計畫與官網前台內容。左側分頁：<b>會員</b>可搜尋與匯出名單；<b>參與紀錄</b>確認會費入帳；<b>活動</b>建立並查看報名；<b>最新消息</b>會公開顯示於官網首頁；<b>網站內容</b>可編輯首頁公告；<a href="/access-mock" target="_blank" rel="noopener">門禁 Mock</a> 可協助手動驗簽與掃碼啟用。</p>
  </div>`;
}

function tabMembers(d, x){
  const body = (d.users||[]).map(u=>{
    const c = x.cByUser[u.id];
    const status = c ? (c.membership_status||'—') : '尚未加入';
    return `<tr data-q="${esc((u.name||'')+' '+(u.email||'')+' '+(u.phone||''))}" data-uid="${esc(u.id)}">
      <td>${esc(u.name||'—')}</td>
      <td class="a-mono">${esc(u.email||'—')}</td>
      <td class="a-mono">${esc(u.phone||'')}</td>
      <td>${u.access_active?'<span class="pill pill-ok">Active</span>':'<span class="pill pill-wait">—</span>'}</td>
      <td class="num">${u.points_balance != null ? Number(u.points_balance) : '—'}</td>
      <td>${esc(u.access_summary||'—')}</td>
      <td>${c?'<span class="pill pill-ok">'+esc(status)+'</span>':'<span class="pill pill-wait">尚未加入</span>'}</td>
      <td class="a-mono">${esc(c?c.cert_no:'')}</td>
      <td class="num">${esc(u.created_at||'')}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="9" class="a-empty">尚無使用者</td></tr>';
  return `<div class="a-sec">
    <h2>會員名單</h2>
    <p class="hint">所有以 Google 登入或已建立的使用者；含門禁 Active、點數餘額、權益摘要、會籍狀態與會員編號。</p>
    <div class="a-toolbar">
      <input type="search" id="m-search" placeholder="搜尋姓名 / Email / 電話…">
      <button class="btn btn--ghost btn-sm" id="m-csv">匯出 CSV</button>
    </div>
    <div class="a-wrap2"><table class="a-tbl">
      <thead><tr><th>姓名</th><th>Email</th><th>電話</th><th>Active</th><th class="num">點數</th><th>權益摘要</th><th>創始狀態</th><th>會員編號</th><th class="num">加入日</th></tr></thead>
      <tbody id="m-body">${body}</tbody></table></div>
    <h3 style="margin-top:1.6rem;font-family:var(--serif);font-size:1.1rem">發放點數</h3>
    <p class="hint">贈點預設一年效期；可自訂到期日。備註必填。</p>
    <div class="a-toolbar" style="flex-wrap:wrap;gap:8px">
      <input id="pg-uid" placeholder="會員 user id" style="min-width:180px">
      <input id="pg-amt" type="number" min="1" placeholder="點數" style="width:100px">
      <input id="pg-exp" type="datetime-local" title="到期（可空＝一年）">
      <input id="pg-note" placeholder="備註（必填）" style="min-width:160px">
      <button class="btn btn--solid btn-sm" id="pg-go">發點</button>
    </div>
  </div>`;
}

function tabCommitments(d){
  const userName = id => ((d.users||[]).find(u=>u.id===id)||{}).name || '—';
  const body = (d.commitments||[]).map(c=>`<tr>
    <td>${esc(userName(c.user_id))}<br><span class="a-mono" style="color:var(--muted)">${esc(c.cert_no)}</span></td>
    <td class="num">${NT(c.amount)}</td>
    <td>${esc(c.contract_status)}</td>
    <td><span class="pill ${c.payment_status==='已付款'?'pill-ok':'pill-wait'}">${esc(c.payment_status)}</span></td>
    <td>${esc(c.membership_status)}</td>
    <td>${c.payment_status==='已付款'?'<span style="color:var(--muted)">已完成</span>':`<button class="btn btn--solid btn-sm" data-confirm="${c.id}">確認入帳</button>`}</td>
  </tr>`).join('') || '<tr><td colspan="6" class="a-empty">尚無參與紀錄</td></tr>';
  return `<div class="a-sec">
    <h2>參與紀錄</h2>

const TABS = [
  { id:'overview',    label:'總覽',     render:tabOverview },
  { id:'members',     label:'會員',     render:tabMembers },
  { id:'commitments', label:'參與紀錄', render:tabCommitments },
  { id:'events',      label:'活動',     render:tabEvents },
  { id:'updates',     label:'最新消息', render:tabUpdates },
  { id:'menu',        label:'菜單',     render:tabMenu },
  { id:'content',     label:'網站內容', render:tabContent },
  { id:'ig',          label:'IG 貼文',  render:()=>`<div class="a-sec"><h2>IG 貼文產生器</h2><p class="hint">填資訊、上傳照片，即時預覽並下載可直接發布的 IG 貼文圖片（方形／直式）。</p><div id="ig-studio"></div></div>` },
  { id:'social',      label:'社群經營', render:tabSocial },
  { id:'admins',      label:'管理員',   render:tabAdmins, super:true },
];

function render(d){
  DATA = d;
  // 社群編輯器若在畫面上，先把 DOM 現值收回 SOCIAL_EDIT，整頁重繪才不會洗掉輸入
  if (SOCIAL_VIEW==='edit' && SOCIAL_EDIT && document.getElementById('sp-e-title')) socialCollectEdit();
  if (!MENU_DIRTY || MENU_DOC === null) {
    MENU_DOC = ensureMenuDoc(d);
  } else {
    const raw = d.content && d.content.menu;
    MENU_SEEDED = !(typeof raw === 'string' && raw.trim()) && !!(window.__MENU_SEED || window.MENU_DATA);
    if (!MENU_DIRTY_TOASTED) {
      toast('菜單有未儲存變更，已保留本機編輯');
      MENU_DIRTY_TOASTED = true;
    }
  }
  syncWindowMenuData();
  if (d.me && d.me.name) try { localStorage.setItem('tth_name', d.me.name); } catch (e) {}
  logoutBtn.style.display='';
  const x = derived(d);
  const tabs = TABS.filter(t => !t.super || d.super);
  if (!tabs.find(t=>t.id===TAB)) TAB='overview';
  const nav = tabs.map(t=>{
    const badge = t.id==='events' && (d.events||[]).length ? `<span class="badge">${d.events.length}</span>` : '';
    return `<button data-tab="${t.id}" class="${t.id===TAB?'on':''}">${t.label}${badge}</button>`;
  }).join('');
  const panels = tabs.map(t=>`<div class="a-tab ${t.id===TAB?'on':''}" data-panel="${t.id}">${t.render(d,x)}</div>`).join('');
  app.innerHTML = `<div class="a-shell">
    <nav class="a-nav">${nav}</nav>
    <div class="a-main">
      <h1 class="a-h1">後台管理</h1>
      <p class="a-sub">創始會員計畫・前台管理${d.super?'（超級管理員）':''}</p>
      ${panels}
    </div>
  </div>`;
  bindNav(); bind(d, x);
}

function bindNav(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    TAB=b.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(n=>n.classList.toggle('on',n.dataset.tab===TAB));
    document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('on',p.dataset.panel===TAB));
    // IG 分頁原先在 display:none 時掛載會得到負／零縮放；切入後重算預覽尺寸
    if (TAB === 'ig' && window.IGStudio && typeof window.IGStudio.resize === 'function') {
      requestAnimationFrame(() => window.IGStudio.resize());
    }
    // 社群經營：首次切入才載入貼文資料
    if (TAB === 'social' && SOCIAL_POSTS === null) loadSocialPosts();
  });
}

function bind(d, x){
  const on = (sel,ev,fn)=>{ const el=document.getElementById(sel); if(el) el.addEventListener(ev,fn); };
  const doThen = async (fn,msg)=>{ try{ await fn(); toast(msg); await refresh(); }catch(e){ toast(e.message); } };

  // 會員：搜尋 + CSV
  on('m-search','input',e=>{ const qv=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#m-body tr').forEach(tr=>{ const qq=(tr.dataset.q||'').toLowerCase();
      tr.style.display = !qv || qq.includes(qv) ? '' : 'none'; }); });
  on('m-csv','click',()=>{ const rows=[['姓名','Email','電話','Active','點數','權益摘要','創始狀態','會員編號','加入日']];
    (d.users||[]).forEach(u=>{ const c=x.cByUser[u.id];
      rows.push([u.name||'', u.email||'', u.phone||'', u.access_active?'Active':'', u.points_balance!=null?String(u.points_balance):'', u.access_summary||'—', c?(c.membership_status||''):'尚未加入', c?c.cert_no:'', u.created_at||'']); });
    downloadCSV('會員名單.csv', rows); });
  on('pg-go','click',()=>{
    const user_id=((document.getElementById('pg-uid')||{}).value||'').trim();
    const amount=Number((document.getElementById('pg-amt')||{}).value);
    const note=((document.getElementById('pg-note')||{}).value||'').trim();
    const expRaw=((document.getElementById('pg-exp')||{}).value||'').trim();
    if(!user_id||!Number.isInteger(amount)||amount<1){ toast('請填 user id 與正整數點數'); return; }
    if(!note){ toast('備註必填'); return; }
    const body={ user_id, amount, note };
    if(expRaw) body.expires_at=new Date(expRaw).toISOString();
    doThen(()=>api('/admin/points/grants',{method:'POST',body}),'已發放點數');
  });

  // 參與紀錄：確認入帳
  document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>doThen(()=>api('/admin/commitments/'+b.dataset.confirm+'/confirm',{method:'POST'}),'已確認入帳'));

  // 活動：建立/更新/編輯/刪除/看報名
  on('ev-save','click',()=>{ const title=document.getElementById('ev-title').value.trim(); if(!title){toast('請輸入活動名稱');return;}
    const editing = !!document.getElementById('ev-id').value;
    doThen(()=>api('/admin/events',{method:'POST',body:{
      id: document.getElementById('ev-id').value || undefined,
      title, starts_at: document.getElementById('ev-when').value || undefined,
      location: document.getElementById('ev-loc').value.trim(),
      capacity: Number(document.getElementById('ev-cap').value)||0,
      status: document.getElementById('ev-status').value,
      description: document.getElementById('ev-desc').value.trim(),
    }}), editing?'已更新活動':'已建立活動'); });
  on('ev-reset','click',()=>resetEventForm());
  document.querySelectorAll('[data-ev-edit]').forEach(b=>b.onclick=()=>{
    const e=(d.events||[]).find(x=>x.id===b.dataset.evEdit); if(!e) return;
    document.getElementById('ev-id').value=e.id;
    document.getElementById('ev-title').value=e.title||'';
    document.getElementById('ev-when').value=toLocalInput(e.starts_at_iso);
    document.getElementById('ev-loc').value=e.location||'';
    document.getElementById('ev-cap').value=e.capacity||0;
    document.getElementById('ev-status').value=e.status||'報名中';
    document.getElementById('ev-desc').value=e.description||'';
    document.getElementById('ev-save').textContent='更新活動';
    document.getElementById('ev-reset').style.display='';
    window.scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelectorAll('[data-ev-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('確定刪除此活動？報名紀錄會一併移除。')) return;
    doThen(()=>api('/admin/events/'+b.dataset.evDel,{method:'DELETE'}),'已刪除活動'); });
  document.querySelectorAll('[data-ev-regs]').forEach(b=>b.onclick=()=>showRegs(b.dataset.evRegs, d));

  // 最新消息
  on('u-add','click',()=>{ const title=document.getElementById('u-title').value.trim(); if(!title){toast('請輸入標題');return;}
    doThen(()=>api('/admin/updates',{method:'POST',body:{title,type:document.getElementById('u-type').value,content:document.getElementById('u-content').value.trim(),date:document.getElementById('u-date').value||undefined}}),'已發布'); });
  document.querySelectorAll('[data-upd-del]').forEach(b=>b.onclick=()=>doThen(()=>api('/admin/updates/'+b.dataset.updDel,{method:'DELETE'}),'已刪除'));

  // 網站內容
  on('ct-save','click',()=>doThen(()=>{
    const val = id => (document.getElementById(id)?.value || '').trim();
    const put = (key, value) => api('/admin/content',{method:'POST',body:{key,value}});
    const jobs = [
      put('home_notice', val('ct-notice')),
      put('space_hero_image', val('ct-space-hero-image')),
    ];
    [1,2,3,4].forEach(n => {
      const zh = val(`ct-space-${n}f-zh`);
      jobs.push(put(`space_${n}f_zh`, zh));
      jobs.push(put(`space_${n}f_en`, val(`ct-space-${n}f-en`)));
      jobs.push(put(`space_${n}f_ja`, val(`ct-space-${n}f-ja`)));
      jobs.push(put(`space_${n}f_image`, val(`ct-space-${n}f-image`)));
      if (n <= 3) jobs.push(put(`space_${n}f`, zh)); // 舊版相容
    });
    return Promise.all(jobs);
  },'已儲存'));

  // 網站內容：換圖上傳（multipart，不能走共用的 api()）
  document.querySelectorAll('[data-space-upload]').forEach(input => input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const targetEl = document.getElementById(input.dataset.target);
    const previewEl = document.getElementById(input.dataset.preview);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch('/api/admin/upload/space', {
        method: 'POST',
        headers: token ? { Authorization: 'Bearer ' + token } : {},
        body: fd,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('上傳失敗（' + r.status + '）'));
      if (targetEl) targetEl.value = data.url;
      if (previewEl) { previewEl.src = data.url; previewEl.style.display = ''; }
      toast('已上傳圖片，記得按「儲存所有網站內容」');
    } catch (e) {
      toast(e.message);
    } finally {
      input.value = '';
    }
  });

  // 管理員
  document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>doThen(()=>api('/admin/users/'+b.dataset.admin+'/admin',{method:'POST',body:{admin:b.dataset.on==='1'}}),'已更新管理權限'));

  // IG 貼文產生器（掛載一次）
  const igHost = document.getElementById('ig-studio');
  if (igHost && window.IGStudio && !igHost.dataset.mounted){ igHost.dataset.mounted='1'; window.IGStudio.mount(igHost); }

  // 菜單
  bindMenu();

  // 社群經營：refresh 後由目前狀態重繪（編輯中內容存於 SOCIAL_EDIT，不遺失）
  if (SOCIAL_POSTS !== null || TAB === 'social') {
    if (SOCIAL_POSTS === null) loadSocialPosts();
    else paintSocial();
  }
}

function applyMenuSearch(qv){
  const q = (qv ?? document.getElementById('mi-search')?.value ?? '').trim().toLowerCase();
  document.querySelectorAll('#mi-body tr').forEach(tr=>{
    const qq = (tr.dataset.q || '').toLowerCase();
    tr.style.display = !q || qq.includes(q) ? '' : 'none';
  });
}

function paintMenu(){
  const panel = document.querySelector('[data-panel="menu"]');
  if (!panel) return;
  const savedSearch = document.getElementById('mi-search')?.value || '';
  syncWindowMenuData();
  panel.innerHTML = tabMenu(DATA);
  bindMenu();
  const searchEl = document.getElementById('mi-search');
  if (searchEl) {
    searchEl.value = savedSearch;
    applyMenuSearch(savedSearch);
  }
}

function resetMenuForm(){
  document.getElementById('mi-id').value = '';
  document.getElementById('mi-cat').value = 'FOOD';
  ['mi-zh','mi-en','mi-note'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('mi-price').value = 0;
  document.getElementById('mi-emo').value = 0;
  document.getElementById('mi-sort').value = 0;
  document.getElementById('mi-alcohol').checked = false;
  document.getElementById('mi-published').checked = false;
  document.getElementById('mi-save').textContent = '新增項目';
  document.getElementById('mi-reset').style.display = 'none';
}

function bindMenu(){
  if (!document.getElementById('mi-body')) return; // 菜單分頁尚未掛載於 DOM
  const on = (sel,ev,fn)=>{ const el=document.getElementById(sel); if(el) el.addEventListener(ev,fn); };

  on('mi-search','input',e=> applyMenuSearch(e.target.value));

  on('mi-save','click',()=>{
    const zh = document.getElementById('mi-zh').value.trim();
    if (!zh){ toast('請輸入品名（中）'); return; }
    const editing = !!document.getElementById('mi-id').value;
    MENU_DOC = MenuLib.upsertItem(MENU_DOC, {
      id: document.getElementById('mi-id').value || undefined,
      cat: document.getElementById('mi-cat').value,
      zh, en: document.getElementById('mi-en').value.trim(),
      price: Number(document.getElementById('mi-price').value) || 0,
      emo: Number(document.getElementById('mi-emo').value) || 0,
      note: document.getElementById('mi-note').value.trim(),
      alcohol: document.getElementById('mi-alcohol').checked,
      published: document.getElementById('mi-published').checked,
      sort: Number(document.getElementById('mi-sort').value) || 0,
    });
    MENU_DIRTY = true;
    toast(editing ? '已更新（尚未存檔）' : '已新增（尚未存檔）');
    paintMenu();
  });
  on('mi-reset','click',()=>resetMenuForm());

  document.querySelectorAll('[data-mi-edit]').forEach(b=>b.onclick=()=>{
    const it = MENU_DOC.items.find(x=>x.id===b.dataset.miEdit); if(!it) return;
    document.getElementById('mi-id').value = it.id;
    document.getElementById('mi-cat').value = it.cat;
    document.getElementById('mi-zh').value = it.zh;
    document.getElementById('mi-en').value = it.en;
    document.getElementById('mi-price').value = it.price;
    document.getElementById('mi-emo').value = it.emo;
    document.getElementById('mi-sort').value = it.sort;
    document.getElementById('mi-note').value = it.note;
    document.getElementById('mi-alcohol').checked = !!it.alcohol;
    document.getElementById('mi-published').checked = !!it.published;
    document.getElementById('mi-save').textContent = '更新項目';
    document.getElementById('mi-reset').style.display = '';
    document.getElementById('mi-zh').scrollIntoView({behavior:'smooth',block:'center'});
  });
  document.querySelectorAll('[data-mi-del]').forEach(b=>b.onclick=()=>{
    if (!confirm('確定刪除此菜單項目？')) return;
    MENU_DOC = MenuLib.removeItem(MENU_DOC, b.dataset.miDel);
    MENU_DIRTY = true;
    toast('已刪除（尚未存檔）');
    paintMenu();
  });

  on('menu-save-server','click',()=>{
    const v = MenuLib.validateDoc(MENU_DOC);
    if (!v.ok){ toast(v.error); return; }
    (async () => {
      try {
        await api('/admin/content', { method:'POST', body:{ key:'menu', value: MenuLib.stringifyDoc(MENU_DOC) } });
        MENU_DIRTY = false;
        MENU_DIRTY_TOASTED = false;
        toast('菜單已儲存至伺服器');
        await refresh();
      } catch(e){ toast(e.message); }
    })();
  });
}

/* 日期工具：本地時區，避免 toISOString 位移一天 */
const spDate = s => { const d = new Date(String(s).replace(' ','T')); return isNaN(d) ? null : d; };
const spYM   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const spDay  = d => `${spYM(d)}-${String(d.getDate()).padStart(2,'0')}`;
const spShiftYM = (ym, n) => { const [Y,M] = ym.split('-').map(Number); return spYM(new Date(Y, M-1+n, 1)); };

// 目前顯示月份：未選則取最早一則排程貼文的月份，否則本月
function socialCalYM(){
  if (SOCIAL_CAL_MONTH) return SOCIAL_CAL_MONTH;
  const ds = (SOCIAL_POSTS||[]).map(p=>spDate(p.scheduled_at)).filter(Boolean).sort((a,b)=>a-b);
  return spYM(ds[0] || new Date());
}

function socialCalendarHTML(){
  const ym = socialCalYM();
  const [Y, M] = ym.split('-').map(Number);
  const lead = (new Date(Y, M-1, 1).getDay() + 6) % 7;      // 週一為週首
  const start = new Date(Y, M-1, 1 - lead);
  const cells = Math.ceil((lead + new Date(Y, M, 0).getDate()) / 7) * 7;

  const byDay = new Map();
  for (const p of socialFiltered()){
    const d = spDate(p.scheduled_at);
    if (!d) continue;
    const k = spDay(d);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push({ p, d });
  }
  const todayK = spDay(new Date());

  let grid = '';
  let monthCount = 0;
  for (let i = 0; i < cells; i++){
    const d = new Date(Y, M-1, 1 - lead + i);
    const k = spDay(d);
    const out = d.getMonth() !== M-1;
    const items = (byDay.get(k) || []).sort((a,b)=>a.d-b.d);
    if (!out) monthCount += items.length;
    const evs = items.map(({p, d:dd})=>{
      const st = SOCIAL_STATUS_META[p.status] || SOCIAL_STATUS_META.draft;
      const hh = `${String(dd.getHours()).padStart(2,'0')}:${String(dd.getMinutes()).padStart(2,'0')}`;
      const t = p.title.replace(/^[WSX]?\d*\s*[｜|]?\s*/, '');
      const tip = hh + ' ' + p.title + '（' + st.label + '）' + (p.phase ? ' · ' + p.phase : '');
      const sum = String(p.caption||'').split('\n').find(l=>l.trim()) || '';
      const hasThumb = p.platform==='ig' && (p.pages||[]).length;
      return `<button class="sp-ev sp-ev--${esc(p.status)}" data-sp-edit="${esc(p.id)}" title="${esc(tip)}">
        <span class="sp-ev-head"><span class="sp-ev-p">${p.platform==='ig'?'IG':'X'} ${esc(hh)}</span>
          <span class="sp-ev-t">${esc(t)}</span></span>
        ${hasThumb?`<span class="sp-ev-thumb" data-cal-prev="${esc(p.id)}"></span>`:''}
        ${sum?`<span class="sp-ev-sum">${esc(sum.slice(0,42))}</span>`:''}</button>`;
    }).join('');
    grid += `<div class="sp-cal-d${out?' out':''}${k===todayK?' today':''}">
      <span class="sp-cal-n">${d.getDate()}</span>${evs}</div>`;
  }
  const head = ['一','二','三','四','五','六','日'].map(w=>`<div class="sp-cal-wd">${w}</div>`).join('');
  return `${socialToolbar()}
  <div class="sp-cal-h">
    <button class="btn btn--ghost btn-sm" id="sp-cal-prev" aria-label="上個月">‹</button>
    <b>${Y} 年 ${M} 月</b>
    <button class="btn btn--ghost btn-sm" id="sp-cal-next" aria-label="下個月">›</button>
    <button class="btn btn--ghost btn-sm" id="sp-cal-today">本月</button>
    <span style="color:var(--muted);font-size:.8rem">本月 ${monthCount} 則</span>
  </div>
  <div class="sp-cal-wrap"><div class="sp-cal">${head}${grid}</div></div>`;
}

function socialAdsHTML(){
  const Ads = window.SocialAdsLib;
  if (!Ads) return `${socialToolbar()}<p class="a-sub">廣告建議引擎載入中…</p>`;
  const today = new Date(), p2=n=>String(n).padStart(2,'0');
  const plan = Ads.budgetPlan(`${today.getFullYear()}-${p2(today.getMonth()+1)}-${p2(today.getDate())}`);
  const layerRows = plan.layers.map(l=>`<tr><td><b>${esc(l.name)}</b></td><td class="num">${NT(l.budget)}</td><td>${esc(l.audience)}</td><td>${esc(l.creatives)}</td><td>${esc(l.goal)}</td></tr>`).join('');
  const relRows = plan.release.map(r=>`<tr style="${r.current?'background:rgba(255,222,52,.12)':''}">
    <td class="a-mono">${esc(r.from.slice(5))} – ${esc(r.to.slice(5))}${r.current?' <span class="pill pill-live">目前</span>':''}</td>
    <td>${esc(r.phase)}</td><td class="num">${NT(r.budget)}</td><td>${esc(r.task)}</td></tr>`).join('');
  const allocRows = plan.allocation.map(a=>`<tr><td>${esc(a.item)}</td><td class="num">${NT(a.amount)}</td><td class="num">${a.pct}%</td></tr>`).join('');

  const igPosts = (SOCIAL_POSTS||[]).filter(p=>p.platform==='ig');
  const recRows = igPosts.map(p=>({ p, rec: Ads.recommendAd(p, SOCIAL_POSTS) }))
    .filter(x=>x.rec.eligible)
    .sort((a,b)=>b.rec.score-a.rec.score)
    .map(({p,rec})=>`<tr>
      <td><a href="#" data-sp-edit="${esc(p.id)}">${esc(p.title)}</a></td>
      <td class="a-mono num">${esc(socialFmtSched(p.scheduled_at))}</td>
      <td>${esc(rec.suitability)} <span style="color:var(--muted)">(${rec.score})</span></td>
      <td>${esc(rec.layer)}</td>
      <td class="num">${rec.budgetHint!=null?NT(rec.budgetHint):'—'}</td>
      <td style="font-size:.8rem;color:var(--muted)">${esc(rec.rationale[0]||'')}</td></tr>`).join('')
    || '<tr><td colspan="6" class="a-empty">尚無 IG 貼文</td></tr>';

  const published = igPosts.filter(p=>p.status==='published');
  const ampRows = published.map(p=>{
    const adv = Ads.amplifyAdvice(p, SOCIAL_POSTS);
    return `<tr><td><a href="#" data-sp-edit="${esc(p.id)}">${esc(p.title)}</a></td>
      <td>${esc(adv.flag)}</td><td style="font-size:.8rem;color:var(--muted)">${adv.notes.map(esc).join('；')}</td></tr>`;
  }).join('') || '<tr><td colspan="3" class="a-empty">尚無已發布貼文（發布後回填成效即可判讀）</td></tr>';

  return `${socialToolbar()}
  <h3 class="sp-h3">預算釋放節奏（廣告 ${NT(plan.adTotal)}／總預算 ${NT(plan.total)}）</h3>
  <div class="a-wrap2"><table class="a-tbl"><thead><tr><th>期間</th><th>階段</th><th class="num">預算</th><th>任務</th></tr></thead><tbody>${relRows}</tbody></table></div>
  <h3 class="sp-h3">三層廣告結構</h3>
  <div class="a-wrap2"><table class="a-tbl"><thead><tr><th>層級</th><th class="num">預算</th><th>受眾</th><th>素材</th><th>目的</th></tr></thead><tbody>${layerRows}</tbody></table></div>
  <h3 class="sp-h3">總預算配置</h3>
  <div class="a-wrap2"><table class="a-tbl"><thead><tr><th>項目</th><th class="num">金額</th><th class="num">占比</th></tr></thead><tbody>${allocRows}</tbody></table></div>
  <h3 class="sp-h3">每貼適投建議（依分數排序）</h3>
  <div class="a-wrap2"><table class="a-tbl"><thead><tr><th>貼文</th><th class="num">排程</th><th>適投</th><th>層級</th><th class="num">建議預算</th><th>理由</th></tr></thead><tbody>${recRows}</tbody></table></div>
  <h3 class="sp-h3">放大判讀（48–72 小時自然觀察後）</h3>
  <div class="a-wrap2"><table class="a-tbl"><thead><tr><th>貼文</th><th>判讀</th><th>說明</th></tr></thead><tbody>${ampRows}</tbody></table></div>`;
}

function paintSocial(){
  const host = document.getElementById('social-body');
  if (!host) return;
  if (SOCIAL_POSTS === null){ host.innerHTML = '<p class="a-sub">載入貼文資料…</p>'; return; }
  host.innerHTML = SOCIAL_VIEW==='edit' && SOCIAL_EDIT ? socialEditHTML()
    : SOCIAL_VIEW==='calendar' ? socialCalendarHTML()
    : SOCIAL_VIEW==='ads' ? socialAdsHTML()
    : socialListHTML();
  bindSocial();
  if (SOCIAL_VIEW==='edit' && SOCIAL_EDIT && SOCIAL_EDIT.platform==='ig') renderSocialPreviews();
  if (SOCIAL_VIEW==='calendar') renderCalendarPreviews();
}

// page 兼容：seed 巢狀 {layout,fields} → renderSpec 攤平格式
function spNormPage(pg){
  if (!pg || pg.category) return pg;
  const lid = String(pg.layout||'03a');
  return Object.assign({category:lid.slice(0,2), variant:lid.slice(2)||'a', format:pg.format||'portrait'}, pg.fields||{});
}

/* 行事曆縮圖：每格 IG 貼文以首頁版型即時渲染（縮放後約 100px 寬） */
function renderCalendarPreviews(){
  if (!window.IGStudio || !window.IGStudio.renderSpec) return;
  document.querySelectorAll('[data-cal-prev]').forEach(box=>{
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===box.dataset.calPrev);
    const pg = p && (p.pages||[])[0];
    if (!pg) return;
    try {
      const node = window.IGStudio.renderSpec(spNormPage(pg));
      const w = box.clientWidth || 110;
      node.style.transformOrigin = 'top left';
      node.style.transform = `scale(${w/1080})`;
      box.innerHTML = '';
      box.appendChild(node);
    } catch(_) { box.textContent = ''; }
  });
}

function renderSocialPreviews(){
  if (!window.IGStudio || !window.IGStudio.renderSpec) return;
  document.querySelectorAll('[data-sp-prev]').forEach(box=>{
    const i = Number(box.dataset.spPrev);
    const pg = (SOCIAL_EDIT.pages||[])[i];
    if (!pg) return;
    try {
      const node = window.IGStudio.renderSpec(spNormPage(pg));
      const w = 150, scale = w/1080;
      box.innerHTML = '';
      box.style.width = w+'px';
      box.style.height = Math.round((pg.format==='square'?1080:1350)*scale)+'px';
      node.style.transformOrigin='top left';
      node.style.transform=`scale(${scale})`;
      box.appendChild(node);
    } catch(e){ box.textContent = '預覽失敗'; }
  });
}

function socialCollectEdit(){
  const p = SOCIAL_EDIT;
  const val = id => { const el=document.getElementById(id); return el?el.value:''; };
  p.title = val('sp-e-title').trim();
  p.platform = val('sp-e-platform');
  p.post_type = val('sp-e-type');
  p.status = val('sp-e-status');
  p.scheduled_at = val('sp-e-sched');
  p.series = val('sp-e-series');
  p.phase = val('sp-e-phase').trim();
  p.audience = val('sp-e-aud').trim();
  p.caption = val('sp-e-caption');
  const enEl = document.getElementById('sp-e-caption-en');
  if (enEl) p.caption_en = enEl.value;
  const jaEl = document.getElementById('sp-e-caption-ja');
  if (jaEl) p.caption_ja = jaEl.value;
  p.hashtags = val('sp-e-tags').trim();
  p.cta = val('sp-e-cta').trim();
  p.external_url = val('sp-e-url').trim();
  p.published_at = val('sp-e-pub');
  p.notes = val('sp-e-notes');
  const metrics = {};
  document.querySelectorAll('[data-sp-metric]').forEach(inp=>{
    if (inp.value !== '') metrics[inp.dataset.spMetric] = Number(inp.value);
  });
  p.metrics = metrics;
}

async function socialSave(){
  socialCollectEdit();
  const p = SOCIAL_EDIT;
  if (!p.title){ toast('請輸入貼文標題'); return; }
  // 儲存期間鎖定表單：避免輸入落在送出快照之後又被 dirty=false 掩蓋
  const locked = [...document.querySelectorAll('#social-body input,#social-body textarea,#social-body select,#social-body button')];
  locked.forEach(el=>el.disabled=true);
  try {
    const body = Object.assign({}, p, { id: p.id || undefined });
    const r = await api('/admin/social/posts', { method:'POST', body });
    if (!p.id) p.id = r.id;
    SOCIAL_DIRTY = false;
    const { posts } = await api('/admin/social/posts');
    SOCIAL_POSTS = posts;
    toast('已儲存貼文');
    paintSocial();   // 成功路徑重繪即恢復可編輯
  } catch(e){ toast(e.message); locked.forEach(el=>el.disabled=false); }
}

async function socialExportPngs(){
  const p = SOCIAL_EDIT;
  if (!window.IGStudio || !window.IGStudio.exportSpecPng) { toast('匯出元件未載入'); return; }
  socialCollectEdit();
  const safe = p.title.replace(/[\/\\?%*:|"<>]/g,'').slice(0,40) || '貼文';
  let okN = 0;
  for (let i=0;i<(p.pages||[]).length;i++){
    try {
      await window.IGStudio.exportSpecPng(p.pages[i], `言文字_IG_${safe}_p${String(i+1).padStart(2,'0')}.png`);
      okN++;
    } catch(e){ toast(`第 ${i+1} 頁匯出失敗：${e.message}`); return; }
  }
  toast(`已匯出 ${okN} 頁 PNG`);
}

function socialNewPost(platform){
  SOCIAL_EDIT = {
    id:'', platform, post_type: platform==='x'?'text':'carousel', status:'draft',
    title:'', caption:'', caption_en:'', caption_ja:'', hashtags: platform==='ig'?'#言文字 #台灣人才聚落':'',
    pages: platform==='ig'?[{category:'03',variant:'a',format:'portrait',q_text:'',q_sub:'',q_by:''}]:[],
    images:[], scheduled_at:'', published_at:'', external_url:'',
    series:'', phase:'', cta:'', audience:'', metrics:{}, notes:'',
  };
  SOCIAL_DIRTY = true; SOCIAL_VIEW = 'edit';

function bindSocial(){
  const host = document.getElementById('social-body');
  if (!host) return;
  const on = (id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };

  host.querySelectorAll('[data-social-view]').forEach(b=>b.onclick=()=>{
    if (SOCIAL_VIEW==='edit' && SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;
    SOCIAL_VIEW=b.dataset.socialView; SOCIAL_EDIT=null; SOCIAL_DIRTY=false; paintSocial();
  });
  on('sp-f-platform','change',e=>{ SOCIAL_FILTER.platform=e.target.value; paintSocial(); });
  on('sp-f-status','change',e=>{ SOCIAL_FILTER.status=e.target.value; paintSocial(); });
  on('sp-f-q','input',e=>{ SOCIAL_FILTER.q=e.target.value;
    document.querySelectorAll('#sp-body tr').forEach(tr=>{ const qq=(tr.dataset.q||'').toLowerCase();
      tr.style.display = !e.target.value.trim() || qq.includes(e.target.value.trim().toLowerCase()) ? '' : 'none'; }); });
  on('sp-new-ig','click',()=>socialNewPost('ig'));
  on('sp-new-x','click',()=>socialNewPost('x'));
  on('sp-cal-prev','click',()=>{ SOCIAL_CAL_MONTH = spShiftYM(socialCalYM(), -1); paintSocial(); });
  on('sp-cal-next','click',()=>{ SOCIAL_CAL_MONTH = spShiftYM(socialCalYM(),  1); paintSocial(); });
  on('sp-cal-today','click',()=>{ SOCIAL_CAL_MONTH = spYM(new Date()); paintSocial(); });

  host.querySelectorAll('[data-sp-edit]').forEach(b=>b.onclick=(ev)=>{
    ev.preventDefault();
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===b.dataset.spEdit); if(!p) return;
    SOCIAL_EDIT = JSON.parse(JSON.stringify(p));
    SOCIAL_EDIT.metrics = SOCIAL_EDIT.metrics||{};
    SOCIAL_EDIT.pages = SOCIAL_EDIT.pages||[];
    SOCIAL_EDIT.images = SOCIAL_EDIT.images||[];
    SOCIAL_VIEW='edit'; SOCIAL_DIRTY=false; paintSocial();
    document.querySelector('[data-panel="social"]')?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  host.querySelectorAll('[data-sp-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定刪除此貼文？')) return;
    try { await api('/admin/social/posts/'+b.dataset.spDel,{method:'DELETE'});
      SOCIAL_POSTS = SOCIAL_POSTS.filter(x=>x.id!==b.dataset.spDel);
      toast('已刪除貼文'); paintSocial();
    } catch(e){ toast(e.message); }
  });

  if (SOCIAL_VIEW!=='edit' || !SOCIAL_EDIT) return;

  /* ---- 編輯器 ---- */
  // 每次輸入即回寫 SOCIAL_EDIT：任何 refresh() 整頁重繪都從最新狀態重建，不遺失
  const markDirty = ()=>{ socialCollectEdit(); SOCIAL_DIRTY=true; };
  host.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',markDirty));
  on('sp-back','click',()=>{
    if (SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;
    SOCIAL_VIEW='list'; SOCIAL_EDIT=null; SOCIAL_DIRTY=false; paintSocial();
  });
  on('sp-save','click',socialSave);
  on('sp-del','click',async()=>{
    if(!confirm('確定刪除此貼文？')) return;
    try { await api('/admin/social/posts/'+SOCIAL_EDIT.id,{method:'DELETE'});
      SOCIAL_POSTS = SOCIAL_POSTS.filter(x=>x.id!==SOCIAL_EDIT.id);
      SOCIAL_VIEW='list'; SOCIAL_EDIT=null; SOCIAL_DIRTY=false;
      toast('已刪除貼文'); paintSocial();
    } catch(e){ toast(e.message); }
  });
  on('sp-copy','click',async()=>{
    socialCollectEdit();
    const p2 = SOCIAL_EDIT;
    // IG：中英同貼合併；X：中文版（日文版用「複製日文」另發）
    const text = p2.platform==='ig'
      ? [p2.caption, p2.caption_en, p2.hashtags].filter(Boolean).join('\n\n')
      : p2.caption + (p2.hashtags?'\n\n'+p2.hashtags:'');
    try { await navigator.clipboard.writeText(text); toast(p2.platform==='ig'?'已複製中英文案＋hashtags':'已複製中文版'); }
    catch(e){ toast('複製失敗：'+e.message); }
  });
  on('sp-copy-ja','click',async()=>{
    socialCollectEdit();
    try { await navigator.clipboard.writeText(SOCIAL_EDIT.caption_ja||''); toast('已複製日文版'); }
    catch(e){ toast('複製失敗：'+e.message); }
  });
  on('sp-export','click',socialExportPngs);
  on('sp-e-caption','input',e=>{
    const el=document.getElementById('sp-xlen');
    if (el) el.textContent = `中文版全形計 2：${socialXLen(e.target.value)}／280`;
  });
  on('sp-e-caption-ja','input',e=>{
    const el=document.getElementById('sp-xlen-ja');
    if (el) el.textContent = `日文版全形計 2：${socialXLen(e.target.value)}／280`;
  });
  on('sp-e-platform','change',()=>{ socialCollectEdit(); paintSocial(); });
  on('sp-e-upload','change',async e=>{
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const ed = SOCIAL_EDIT;   // 上傳期間可能切換貼文：完成時比對仍是同一篇才寫入
    try {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/admin/upload/social',{ method:'POST', headers: token?{Authorization:'Bearer '+token}:{}, body: fd });
      const data = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(data.error || ('上傳失敗（'+r.status+'）'));
      if (!SOCIAL_EDIT || SOCIAL_EDIT !== ed) { toast('已離開原貼文，圖片未加入（'+data.url+'）'); return; }
      socialCollectEdit();
      SOCIAL_EDIT.images.push(data.url);
      SOCIAL_DIRTY = true;
      toast('已上傳，記得儲存貼文'); paintSocial();
    } catch(err){ toast(err.message); } finally { e.target.value=''; }
  });
  host.querySelectorAll('[data-sp-imgdel]').forEach(b=>b.onclick=()=>{
    socialCollectEdit();
    SOCIAL_EDIT.images.splice(Number(b.dataset.spImgdel),1);
    SOCIAL_DIRTY=true; paintSocial();
  });

  /* 頁面編輯 */
  on('sp-pgadd','click',()=>{
    socialCollectEdit();
    SOCIAL_EDIT.pages.push({category:'03',variant:'a',format:'portrait',q_text:'',q_sub:'',q_by:''});
    SOCIAL_DIRTY=true; paintSocial();
  });
  host.querySelectorAll('[data-sp-pglayout]').forEach(sel=>sel.onchange=()=>{
    socialCollectEdit();
    const i=Number(sel.dataset.spPglayout), lid=sel.value;
    const pg=SOCIAL_EDIT.pages[i];
    SOCIAL_EDIT.pages[i]=Object.assign({},pg,{category:lid.slice(0,2),variant:lid.slice(2)});
    SOCIAL_DIRTY=true; paintSocial();
  });
  host.querySelectorAll('[data-sp-pg]').forEach(inp=>inp.addEventListener('input',()=>{
    const i=Number(inp.dataset.spPg), k=inp.dataset.spK;
    if (SOCIAL_EDIT.pages[i]) SOCIAL_EDIT.pages[i][k]=inp.value;
    SOCIAL_DIRTY=true;
    // 只重繪這一頁的預覽
    const box=document.querySelector(`[data-sp-prev="${i}"]`);
    if (box && window.IGStudio && window.IGStudio.renderSpec){
      try { const node=window.IGStudio.renderSpec(spNormPage(SOCIAL_EDIT.pages[i]));
        node.style.transformOrigin='top left'; node.style.transform='scale('+(150/1080)+')';
        box.innerHTML=''; box.appendChild(node);
      } catch(e){}
    }
  }));
  const movePage=(i,dir)=>{
    socialCollectEdit();
    const pgs=SOCIAL_EDIT.pages, j=i+dir;
    if (j<0||j>=pgs.length) return;
    [pgs[i],pgs[j]]=[pgs[j],pgs[i]];
    SOCIAL_DIRTY=true; paintSocial();
  };
  host.querySelectorAll('[data-sp-pgup]').forEach(b=>b.onclick=()=>movePage(Number(b.dataset.spPgup),-1));
  host.querySelectorAll('[data-sp-pgdn]').forEach(b=>b.onclick=()=>movePage(Number(b.dataset.spPgdn),1));
  host.querySelectorAll('[data-sp-pgdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('刪除此頁？')) return;
    socialCollectEdit();
    SOCIAL_EDIT.pages.splice(Number(b.dataset.spPgdel),1);
    SOCIAL_DIRTY=true; paintSocial();
  });
}

async function ensureIgScripts() {
  if (window.IGStudio) return;
  const load = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
  await load('/ig-studio-lib.js');
  await load('/vendor/html-to-image.js');
  await load('/menu-data.js');
  await load('/ig-studio.js');
  await load('/social-ads-lib.js');
}

async function refresh(){ const d=await api('/state'); await ensureIgScripts(); render(d); }

async function main(){
  if (!token) return renderLogin();
  try {
    const d = await api('/state');
    if (d.role !== 'admin') return renderLogin('此 Google 帳號沒有管理員權限。請以超管或已授權的管理員帳號登入。');
    await ensureIgScripts();
    render(d);
  } catch(e){
    if (String(e.message).includes('登入') || String(e.message).includes('401')) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); return renderLogin(); }
    app.innerHTML = `<p class="a-center">暫時無法連線：${esc(e.message)}<br><button class="btn btn--ghost btn-sm" style="margin-top:1rem" onclick="location.reload()">重新整理</button></p>`;
  }
}
main();
</script>
</body>
</html>
